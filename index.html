<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Euro-area government bonds, day by day: curves, spreads to Germany, relative value, futures basis, auctions. Public data, refreshed every day.">
<title>EGB Dashboard</title>
<meta property="og:type" content="website">
<meta property="og:title" content="EGB Dashboard">
<meta property="og:description" content="Euro-area government bonds, day by day: curves, spreads to Germany, relative value, futures basis, auctions. Public data, refreshed every day.">
<meta property="og:url" content="https://arthurmarc1102-droid.github.io/egb-dashboard/">
<meta property="og:image" content="https://arthurmarc1102-droid.github.io/egb-dashboard/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f15'/%3E%3Cpath d='M6 24C11 12 19 9 26 8' fill='none' stroke='%23e8e6e1' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='24' r='3' fill='%23e8e6e1'/%3E%3Ccircle cx='15.25' cy='11.9' r='3' fill='%23e8e6e1'/%3E%3Ccircle cx='26' cy='8' r='3' fill='%23e8e6e1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&amp;display=swap">
<style>
:root{
  /* EGB Dashboard: a desk terminal, dark only by choice.
     Hue belongs to the data and to nothing else: red = higher yield, wider, cheaper; blue = lower, tighter, richer;
     one fixed hue per country. The interface itself is neutral ink on navy, so a coloured mark always means a number.
     Two voices: words (the closing note) in a serif, numbers in a condensed sans with tabular figures.
     Layout: masthead with five spaces, a row of sections, one filter row, then a 12-column grid of panes.
     Under 900px the spaces move to a bar at the bottom of the screen and panes run edge to edge. */
  color-scheme: dark;
  --plane:#0a0f15;
  --surface:#101720;
  --raised:#17202b;
  --hover:#141c27;
  --rule:#1f2b38;
  --axis:#2e3d4d;
  --ink:#e8e6e1;
  --ink-2:#aab2bb;
  --ink-3:#7f8a96;
  --up:#e66767;
  --down:#3987e5;
  --flat:#2a3644;
  --c-DE:#3987e5; --c-FR:#d95926; --c-IT:#199e70; --c-ES:#c98500;
  --c-NL:#d55181; --c-BE:#0ca30c; --c-AT:#9085e9; --c-PT:#e66767;
  --font-data:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-note:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --gutter:20px;
  --gap:10px;
  --bar:0px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scrollbar-color:var(--axis) var(--plane)}
html,body{margin:0; padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:var(--font-data); font-size:13.5px; line-height:1.35;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom, 0px));
}
::selection{background:var(--axis)}
a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--axis); text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:2px}
main:focus{outline:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:8px; top:-48px; z-index:50; background:var(--ink); color:var(--plane); padding:8px 12px; border-radius:3px; text-decoration:none; font-weight:500}
.skip:focus{top:8px}

/* ---------- masthead, spaces, sections ---------- */
.top{position:sticky; top:0; z-index:20; background:var(--plane)}
.masthead{display:flex; align-items:stretch; gap:26px; padding:0 var(--gutter); min-height:52px; border-bottom:1px solid var(--rule)}
.brand{margin:0; font-size:17px; font-weight:600; letter-spacing:.012em; display:flex; flex:none}
.brand a{display:flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none; white-space:nowrap}
.brand svg{flex:none}
.spaces{display:flex; align-items:stretch; gap:2px; min-width:0}
.space{appearance:none; background:none; border:0; position:relative; padding:0 12px; color:var(--ink-2); font-size:14.5px; font-weight:500; white-space:nowrap; cursor:pointer}
.space:hover{color:var(--ink)}
.space[aria-current="page"]{color:var(--ink)}
.space[aria-current="page"]::after{content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; background:var(--ink)}
.space .short{display:none}
.meta{margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--ink-2); font-size:13px; white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden}
.asof b{color:var(--ink); font-weight:500}
.subnav{display:flex; align-items:center; gap:16px; padding:0 var(--gutter); min-height:42px; border-bottom:1px solid var(--rule)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:none; max-width:100%; margin-left:-10px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; border-radius:4px; padding:5px 10px; color:var(--ink-2); font-size:13.5px; font-weight:500; white-space:nowrap; cursor:pointer}
.tab:hover{color:var(--ink); background:var(--surface)}
.tab[aria-selected="true"]{color:var(--ink); background:var(--raised)}
.about{color:var(--ink-3); font-family:var(--font-text); font-size:12.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.legend-key{display:flex; gap:14px; align-items:center; color:var(--ink-3); font-size:12.5px; margin-left:auto; white-space:nowrap; flex:none}
.legend-key i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.k-up{background:var(--up)} .k-down{background:var(--down)}
.fkey{display:none}
@media (max-width:1040px){ .asof .pre{display:none} }

/* ---------- filter row ---------- */
.filters{display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; padding:10px var(--gutter) 0}
.fgroup{display:flex; align-items:center; gap:8px; min-width:0; max-width:100%}
.flabel{color:var(--ink-3); font-size:12.5px; white-space:nowrap}
.ftoggle{display:none}
.seg{display:inline-flex; flex:0 1 auto; min-width:0; max-width:100%; border:1px solid var(--rule); border-radius:4px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; background:var(--surface)}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none; background:none; border:0; border-right:1px solid var(--rule); padding:4px 9px; color:var(--ink-2);
  font-size:13px; cursor:pointer; min-height:28px; display:inline-flex; align-items:center; gap:5px; flex:none}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink); background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--raised); color:var(--ink); box-shadow:inset 0 -2px 0 var(--ink)}
.swatch{width:10px; height:3px; border-radius:1px; display:inline-block; flex:none}
select.sel{font-size:13px; color:var(--ink); background-color:var(--surface); border:1px solid var(--rule); border-radius:4px;
  padding:4px 24px 4px 8px; min-height:28px; max-width:100%;
  appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 12px) 12px, calc(100% - 8px) 12px; background-size:4px 4px; background-repeat:no-repeat}
select.sel:hover{border-color:var(--axis)}

/* ---------- grid and panes ---------- */
main{padding:var(--gap) var(--gutter) 30px}
.grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--gap)}
.panel{grid-column:span 12; background:var(--surface); border:1px solid var(--rule); border-radius:4px; min-width:0; display:flex; flex-direction:column}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media (max-width:1180px){.s3,.s4{grid-column:span 6}.s5,.s7,.s8{grid-column:span 12}}
@media (max-width:760px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.panel > header{display:flex; align-items:center; gap:4px 10px; flex-wrap:wrap; padding:11px 14px 0; min-width:0}
.panel h2{font-size:14.5px; font-weight:600; margin:0; letter-spacing:.005em; text-wrap:balance}
.panel .sub{color:var(--ink-3); font-size:12.5px}
.panel .tools{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-width:0; max-width:100%}
.panel-body{padding:9px 14px 12px; min-width:0; flex:1; display:flex; flex-direction:column}
.panel-body > .fill{flex:1; min-height:0}
.panel > footer{margin-top:auto; padding:0 14px 10px; color:var(--ink-3); font-size:12px; font-family:var(--font-text); line-height:1.45}
.linkbtn{appearance:none; background:none; border:1px solid var(--rule); border-radius:4px; padding:3px 8px; color:var(--ink-2); font-size:12.5px; cursor:pointer; min-height:26px}
.linkbtn:hover{color:var(--ink); border-color:var(--axis); background:var(--hover)}
.linkbtn[aria-pressed="true"]{color:var(--ink); background:var(--raised)}
.linkbtn:disabled{opacity:.45; cursor:not-allowed}
.empty{color:var(--ink-2); padding:14px 2px; font-family:var(--font-text); font-size:13px; line-height:1.5; max-width:62ch}

/* ---------- tables ---------- */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--axis) transparent}
table.t{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
.t th{font-weight:500; color:var(--ink-3); font-size:12.5px; text-align:right; padding:4px 8px 5px; border-bottom:1px solid var(--axis); white-space:nowrap}
.t td{padding:5px 8px; border-bottom:1px solid var(--rule); text-align:right; white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t th:first-child,.t td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); z-index:1}
.t td.l,.t th.l{text-align:left}
.t td.wrap{white-space:normal; min-width:180px}
.t tbody tr:hover td{background-color:var(--hover)}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background-color:var(--raised)}
.t tbody tr[aria-selected="true"] td{background-color:var(--raised)}
.t tbody tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--ink)}
.t th[aria-sort="ascending"]::after{content:" \25B4"}
.t th[aria-sort="descending"]::after{content:" \25BE"}
.name{font-weight:500}
.muted{color:var(--ink-3)}
.lvl{font-weight:500}
td.heat{position:relative}
td.heat > span{position:relative}
.zchip{display:inline-block; min-width:44px; padding:1px 6px; border-radius:3px; text-align:right}
.ctry{display:inline-flex; align-items:center; gap:6px}
.pill{display:inline-block; padding:1px 7px; border:1px solid var(--axis); border-radius:10px; font-size:12px; color:var(--ink-2); white-space:nowrap}
.pill.ok{border-color:#2f6f4e; color:#bfe3cf}
.pill.warn{border-color:#7a5a1e; color:#ecd9a8}
.pill.off{border-color:var(--axis); color:var(--ink-3)}

/* ---------- charts ---------- */
.chart{position:relative; min-width:0}
.chart svg{display:block; max-width:100%; touch-action:pan-y}
.chart .tick, .axis-label{fill:var(--ink-3); font-size:11.5px; font-family:var(--font-data); font-variant-numeric:tabular-nums}
.chart .endlabel{fill:var(--ink-2); font-size:12px; font-family:var(--font-data); font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:0 0 6px; color:var(--ink-2); font-size:12.5px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:2px; border-radius:1px; display:inline-block}
.tip{position:absolute; pointer-events:none; z-index:30; background:#0b1118; border:1px solid var(--axis); border-radius:4px; padding:6px 8px;
  font-size:12.5px; min-width:120px; max-width:260px; box-shadow:0 6px 18px rgba(0,0,0,.45); font-variant-numeric:tabular-nums}
.tip .d{color:var(--ink-2); margin-bottom:3px}
.tip .r{display:flex; align-items:center; gap:7px; justify-content:space-between}
.tip .r i{width:12px; height:2px; display:inline-block; border-radius:1px; flex:none}
.tip .r .n{color:var(--ink-2); margin-right:auto}
.tip .r b{font-weight:600; color:var(--ink)}

/* ---------- stat rows ---------- */
.stats{display:flex; flex-wrap:wrap; gap:6px 22px; padding:2px 0 8px}
.stat{min-width:74px}
.stat .k{color:var(--ink-3); font-size:12px}
.stat .v{font-size:17px; font-weight:500; font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px; color:var(--ink-2); font-weight:400; margin-left:3px}
.stats2{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 16px}

/* ---------- z bars ---------- */
.zlist{display:grid; grid-template-columns:minmax(96px,auto) 1fr auto; gap:6px 10px; align-items:center}
.zlist .zn{font-weight:500; white-space:nowrap}
.zlist .zv{text-align:right; font-variant-numeric:tabular-nums; min-width:44px}
.ztrack{position:relative; height:10px; background:linear-gradient(var(--rule),var(--rule)) center/100% 1px no-repeat}
.ztrack::before{content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--axis)}
.zbar{position:absolute; top:1px; height:8px}
.zbar.pos{left:50%; border-radius:0 4px 4px 0; background:var(--up)}
.zbar.neg{right:50%; border-radius:4px 0 0 4px; background:var(--down)}

/* ---------- lists and prose ---------- */
.feed{display:flex; flex-direction:column; max-height:520px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--axis) transparent}
.feed.short{max-height:none}
.item{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; padding:7px 0; border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .when{color:var(--ink-3); font-size:12.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
.item .what{font-family:var(--font-text); font-size:13px; line-height:1.4}
.item .who{grid-column:2; color:var(--ink-3); font-size:12px}
.prose{font-family:var(--font-text); font-size:13.5px; line-height:1.55; color:var(--ink-2); max-width:72ch}
.prose h3{font-family:var(--font-data); font-size:14px; color:var(--ink); margin:14px 0 4px; font-weight:600}
.prose p{margin:0 0 8px}
.prose code{font-family:var(--font-data); color:var(--ink); background:var(--raised); padding:0 4px; border-radius:2px; font-size:13px}
.prose ul{margin:0 0 8px; padding-left:18px}
.foot{padding:0 var(--gutter) 28px; color:var(--ink-3); font-size:12.5px; font-family:var(--font-text); line-height:1.5; max-width:110ch}
.foot p{margin:0 0 4px}
.heatwrap td.hm{text-align:center; min-width:46px; padding:6px 4px; color:var(--ink)}
.heatwrap th{text-align:center}
.heatwrap th:first-child{text-align:left}
td.hm.click{cursor:pointer}

/* ---------- forms: builder, backtest ---------- */
.inp{background:var(--raised); color:var(--ink); border:1px solid var(--axis); border-radius:4px; padding:4px 6px; font-size:13px; min-width:0; min-height:28px}
.inp:hover{border-color:var(--ink-3)}
input[type=date].inp{color-scheme:dark}
.btn{appearance:none; background:var(--raised); color:var(--ink); border:1px solid var(--axis); border-radius:4px; padding:5px 11px; font-size:13px; cursor:pointer; min-height:30px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--plane); font-weight:500}
.btn.primary:hover{background:#fff; border-color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.legs{display:flex; flex-direction:column; gap:6px; margin:4px 0 8px}
.legrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.legrow .sel{flex:1 1 180px; min-width:0}
.row-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0}
.field{display:inline-flex; flex-direction:column; gap:3px; font-size:12px; color:var(--ink-3); min-width:0}
.field > span{white-space:nowrap}
.field .inp[type=text]{width:100%}
.controls{display:flex; flex-wrap:wrap; gap:12px 16px; align-items:flex-end}
.controls .sel{max-width:260px}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--raised); border:1px solid var(--rule); border-radius:999px; padding:2px 4px 2px 10px; font-size:13px}
.chip .x{appearance:none; background:none; border:0; color:var(--ink-3); font-size:15px; line-height:1; cursor:pointer; padding:0 6px}
.chip .x:hover{color:var(--ink)}
.daterange{display:inline-flex; gap:6px; align-items:center; margin-left:4px}
.split{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:16px; align-items:start}

/* ---------- brief: the closing note and the curve ladder ---------- */
.panel.note{background:none; border-color:transparent; padding:8px 22px 6px 2px}
.note .kicker{margin:0; font-size:13px; font-weight:500; color:var(--ink-3); letter-spacing:.005em}
.note .headline{font-family:var(--font-note); font-optical-sizing:auto; font-variant-numeric:lining-nums; font-weight:500; font-size:31px; line-height:1.17; letter-spacing:-.008em;
  margin:9px 0 18px; max-width:21em; text-wrap:balance}
.lines{display:grid; grid-template-columns:max-content minmax(0,1fr); gap:7px 16px; margin:0; font-family:var(--font-text); font-size:13.5px; line-height:1.45; max-width:74ch}
.lines dt{color:var(--ink-3)}
.lines dt a{color:inherit}
.lines dt a:hover{color:var(--ink)}
.lines dd{margin:0}
.note .by{margin:16px 0 0; color:var(--ink-3); font-family:var(--font-text); font-size:12px; line-height:1.45; max-width:74ch}
@media (min-width:1181px){ #p-next{grid-row:span 2} }
.ladder-t{table-layout:fixed}
.ladder-t th,.ladder-t td{text-align:center; padding:5px 2px; overflow:hidden; text-overflow:ellipsis}
.ladder-t th:first-child,.ladder-t td:first-child{text-align:left; padding-left:0}
.ladder-t tbody tr.lv td{border-bottom:0; padding-bottom:2px}
.ladder-t tbody tr.chg td{font-size:12.5px; padding-top:3px}
.ladder-t .col-on{box-shadow:inset 0 0 0 99px rgba(232,230,225,.06)}

@media (prefers-reduced-motion:no-preference){
  .space,.tab,.seg button,.linkbtn,.btn,.inp,select.sel{transition:color .12s, background-color .12s, border-color .12s}
}

/* ---------- small screens: spaces at the bottom, panes edge to edge ---------- */
@media (max-width:1180px){ .about{display:none} }
@media (max-width:900px){
  :root{--gutter:14px; --gap:8px; --bar:54px}
  .masthead{min-height:46px; gap:10px}
  .brand{font-size:16px}
  .spaces{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--plane); border-top:1px solid var(--rule);
    height:calc(var(--bar) + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px);
    display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:0}
  .space{padding:0 2px; font-size:13.5px}
  .space .long{display:none}
  .space .short{display:inline}
  .space[aria-current="page"]::after{left:26%; right:26%; top:-1px; bottom:auto}
  .subnav{min-height:42px; padding-right:0}
  .subnav.solo, .subnav .legend-key{display:none}
  .tabs{flex:1 1 auto; padding-right:var(--gutter)}
  .tab{padding:7px 10px}
  .filters{padding-top:8px}
  .ftoggle{display:flex; align-items:center; gap:10px; width:100%; appearance:none; background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:7px 10px; min-height:36px; cursor:pointer; text-align:left}
  .ftoggle span:first-child{font-weight:500}
  .ftoggle span:last-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ftoggle::after{content:""; margin-left:auto; flex:none; width:7px; height:7px; border-right:1.5px solid var(--ink-2); border-bottom:1.5px solid var(--ink-2); transform:rotate(45deg) translateY(-2px)}
  .ftoggle[aria-expanded="true"]::after{transform:rotate(-135deg) translateY(-2px)}
  .filters:not(.open) > .fgroup{display:none}
  .filters.open > .fkey{display:flex; margin-left:0; flex-wrap:wrap; gap:6px 14px; white-space:normal}
  .fgroup{flex-wrap:wrap; width:100%}
  .flabel{width:100%}
  .seg button{min-height:34px; padding:4px 11px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* EGB Dashboard: client-side engine.
   The page reads static JSON files from ./data and computes every derived number in the browser.
   No server and no build step: the same files work on any static host.

   Sections: 1 constants and state, 2 helpers, 3 series maths, 4 universe of structures,
             5 small graphics, 6 charts, 7 views, 8 shell (tabs, filters, routing). */
(function () {
  'use strict';

  // ===================================================================== 1. constants and state
  const COUNTRIES = { DE: 'Germany', FR: 'France', IT: 'Italy', ES: 'Spain', NL: 'Netherlands', BE: 'Belgium', AT: 'Austria', PT: 'Portugal' };
  const ORDER = ['DE', 'FR', 'IT', 'ES', 'NL', 'BE', 'AT', 'PT'];
  const REF = 'DE';                                   // spreads and boxes are quoted against Germany
  const SLOPES = [[2, 10], [5, 30], [2, 5], [5, 10], [10, 30], [2, 30]];
  const FLIES = [[2, 5, 10], [5, 10, 30], [2, 10, 30], [5, 7, 10], [10, 15, 30], [10, 20, 30]];
  const HEADLINE = [2, 5, 10, 30];                    // maturities shown when several countries share the matrix
  const WINDOWS = { '1M': 21, '3M': 63, '6M': 126, '1Y': 252, '2Y': 504 };          // z-score windows, in observations
  const RANGES = { '3M': 63, '6M': 126, '1Y': 252, '2Y': 504, '5Y': 1260, 'Max': Infinity, 'Custom': 'custom' }; // chart look-back
  const HORIZONS = { '1D': 1, '1W': 5, '1M': 21, 'YTD': 'ytd' };
  const HEAT_BP = { '1D': 10, '1W': 20, '1M': 40, 'YTD': 80 };           // change (bp) at which the tint saturates
  const HEAT_RET = { '1D': 0.5, '1W': 1, '1M': 2, 'YTD': 4 };            // same, for approximate returns (%)
  const CATS = { all: 'All', outright: 'Outright', spread: 'Spread', slope: 'Slope', fly: 'Fly', box: 'Box', custom: 'Custom' };
  // Sections: id -> [label, what the screen is for, filters it uses]
  const TAB = {
    home: ['Brief', 'The latest fixings in one screen: what moved, what looks stretched, what comes next.', ['countries', 'win']],
    monitor: ['Monitor', 'Yields, changes and spreads to Germany at the latest fixing.', ['countries', 'win', 'range']],
    curves: ['Curves', 'Curve snapshots and the history of yields, slopes and spreads.', ['countries', 'range']],
    rates: ['Rates', 'The euro short-term rate and the ECB policy rates.', ['range']],
    rv: ['RV screen', 'Every spread, slope, butterfly and box, ranked by z-score.', ['countries', 'win', 'range']],
    builder: ['Builder', 'Build any weighted structure, save it, and chart anything against anything.', ['win', 'range']],
    analysis: ['Analysis', 'Regressions, betas and correlations between any two series.', ['countries', 'win', 'range']],
    curvelab: ['PCA & carry', 'Principal components, carry and roll-down, rich and cheap against a fitted curve.', ['countries']],
    backtest: ['Backtest', 'Test a z-score rule on any structure, with costs and no look-ahead.', ['countries']],
    futures: ['Futures', 'Eurex bond futures: settlement, deliverable baskets, basis and cheapest to deliver.', []],
    auctions: ['Auctions', 'Government bond auctions: calendar and results.', ['countries']],
    blotter: ['News & calendar', 'Official headlines and the events that can move rates.', ['countries']],
    sources: ['Sources & methods', 'Where every number comes from, how it is computed, and what it cannot tell.', []],
  };
  // Spaces: [id, label, short label for the phone bar, sections]
  const SPACES = [['home', 'Brief', 'Brief', ['home']], ['markets', 'Markets', 'Markets', ['monitor', 'curves', 'rates']],
    ['relval', 'Relative value', 'RV', ['rv', 'builder', 'analysis', 'curvelab', 'backtest']],
    ['supply', 'Futures & supply', 'Futures', ['futures', 'auctions']], ['news', 'News & sources', 'News', ['blotter', 'sources']]];

  const COL = {};                                     // resolved colours, filled at start-up
  const DATA = { market: null, auctions: null, news: null, events: null, sources: null, futures: null };
  let U = [];                                         // universe of structures built from the yield series
  let BYID = new Map();

  const S = Object.assign({
    tab: 'home', last: {}, countries: null, win: '3M', range: '1Y', horizon: '1D', metric: 'bp', tenor: 10,
    shape: 'level', compare: 'none', slope: '2s10s', rvCat: 'all', rvSort: 'absz', rvDir: -1, rvSel: null,
    pairA: null, pairB: null, regY: null, regX: null, corrSet: null, aucCountry: 'all', futSel: null, tables: {},
    from: '', to: '', bDraft: null, bEdit: null, wbIds: null, wbMode: 'level', bt: null, btSel: null, clC: null, clWin: '1Y', clHor: '3M', clFly: null
  }, restore());

  function restore() { try { return JSON.parse(localStorage.getItem('egb-state') || '{}'); } catch (e) { return {}; } }

  // ===================================================================== 2. helpers
  const MINUS = '−', DASH = '–';
  function num(x, d, sign) {

      else if (k === 'svg') el.innerHTML = v;                       // only for SVG strings built in this file

  }
  function select(groups, current, onPick, label) {
    const el = h('select', { class: 'sel', 'aria-label': label, onchange: e => onPick(e.target.value) });

      const target = gname ? h('optgroup', { label: gname }) : el;
      for (const [val, text] of opts) target.append(h('option', { value: val, selected: val === current }, text));
      if (gname) el.append(target);

    return el;
  }
  function set(patch) { Object.assign(S, patch); persist(); render(); }

  // ===================================================================== 3. series maths
  // A series is { dates: [ISO strings, ascending], values: [numbers] }.

  /** Inner join on dates: keep the days where every input has a value, then apply fn to the row. */
  function join(list, fn) {
    const maps = list.slice(1).map(s => { const m = new Map(); s.dates.forEach((d, i) => m.set(d, s.values[i])); return m; });
    const dates = [], values = [];
    list[0].dates.forEach((d, i) => {
      const row = [list[0].values[i]];
      for (const m of maps) row.push(m.get(d));
      if (row.every(Number.isFinite)) { dates.push(d); values.push(fn(...row)); }
    });
    return { dates, values };
  }

  /** Rolling mean and sample standard deviation over the last n observations, current one included. */
  function rolling(values, n) {
    const mean = new Array(values.length).fill(NaN), sd = new Array(values.length).fill(NaN);
    for (let i = n - 1; i < values.length; i++) {
      let s = 0; for (let j = i - n + 1; j <= i; j++) s += values[j];
      const m = s / n; let q = 0; for (let j = i - n + 1; j <= i; j++) q += (values[j] - m) * (values[j] - m);
      mean[i] = m; sd[i] = Math.sqrt(q / (n - 1));
    }
    return { mean, sd };
  }

  /** Index of the observation h steps back, or of the last observation of the previous year for 'ytd'. */
  function backIndex(s, hz) {
    const L = s.values.length;
    if (hz === 'ytd') { const yr = s.dates[L - 1].slice(0, 4); for (let i = L - 1; i >= 0; i--) if (s.dates[i].slice(0, 4) < yr) return i; return -1; }
    return L - 1 - hz;
  }

  /** Change over a horizon, always in basis points (yields are stored in %, spreads already in bp). */
  function change(s, hz) {
    const i = backIndex(s, hz); if (i < 0) return NaN;
    return (s.values[s.values.length - 1] - s.values[i]) * (s.unit === 'pct' ? 100 : 1);
  }

  /** Approximate total return (%) of a par bond of that maturity over the horizon:
      minus modified duration times the yield change, plus the running yield earned over the period.
      Duration is that of an annual-pay par bond at the starting yield. Roll-down and convexity are ignored. */
  function approxReturn(s, hz) {
    const i = backIndex(s, hz); if (i < 0 || !s.tenor) return NaN;
    const L = s.values.length, y0 = s.values[i], y1 = s.values[L - 1], y = y0 / 100;
    const dur = Math.abs(y) < 1e-9 ? s.tenor : (1 - Math.pow(1 + y, -s.tenor)) / y;
    const days = (parseD(s.dates[L - 1]) - parseD(s.dates[i])) / 864e5;
    return -dur * (y1 - y0) + y0 * days / 365;
  }

  /** Level statistics over the last n observations: z-score, percentile, range. */
  function stats(s, n) {
    const L = s.values.length; if (!L) return null;
    const last = s.values[L - 1], w = s.values.slice(Math.max(0, L - n));
    const out = { last, n: w.length, full: w.length >= n, date: s.dates[L - 1] };
    if (w.length >= Math.max(20, 0.9 * n)) {
      const mean = d3.mean(w), sd = d3.deviation(w);
      Object.assign(out, { mean, sd, min: d3.min(w), max: d3.max(w), z: sd > 0 ? (last - mean) / sd : NaN,
        pct: 100 * (w.filter(v => v < last).length + 0.5 * w.filter(v => v === last).length) / w.length });
    } else Object.assign(out, { mean: NaN, sd: NaN, min: NaN, max: NaN, z: NaN, pct: NaN });
    return out;
  }

  /** Day-to-day changes in bp of several structures, on the days they all share. Returns { dates, cols }. */
  function jointChanges(list) {
    const j = join(list, (...row) => row);
    const k = list.map(s => (s.unit === 'pct' ? 100 : 1)), dates = [], cols = list.map(() => []);
    for (let i = 1; i < j.values.length; i++) { dates.push(j.dates[i]); list.forEach((_, c) => cols[c].push((j.values[i][c] - j.values[i - 1][c]) * k[c])); }
    return { dates, cols, levels: j };
  }

  /** Ordinary least squares y = alpha + beta x. */
  function ols(x, y) {
    const n = x.length; if (n < 3) return null;
    const mx = d3.mean(x), my = d3.mean(y); let sxx = 0, sxy = 0, syy = 0;
    for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
    if (!(sxx > 0) || !(syy > 0)) return null;
    const beta = sxy / sxx;
    return { beta, alpha: my - beta * mx, r2: (sxy * sxy) / (sxx * syy), corr: sxy / Math.sqrt(sxx * syy), n };
  }

  const tail = (s, n) => (n === 'custom' ? inRange(s) : Number.isFinite(n) ? { ...s, dates: s.dates.slice(-n), values: s.values.slice(-n) } : s);

  // ===================================================================== 4. universe of structures
  /** Build every outright, spread, slope, butterfly and box the loaded yield series allow.
      `comp` gives each structure as weights on yields (in bp): it is what the carry of a structure is computed from. */
  function buildUniverse(market) {
    const Y = {};
    for (const s of market.series) if (s.group === 'yield') (Y[s.country] = Y[s.country] || {})[s.tenor] = s;
    const out = [], tenors = c => Object.keys(Y[c] || {}).map(Number).sort((a, b) => a - b);
    const add = o => { if (o.values.length > 1) out.push(o); };
    const src = (...ss) => [...new Set(ss.map(s => s.source))];
    for (const c of ORDER) for (const t of tenors(c)) {
      const s = Y[c][t];
      add({ id: `${c}_${t}Y`, cat: 'outright', country: c, tenor: t, name: `${c} ${t}Y`, long: `${COUNTRIES[c]} ${t}-year yield`, unit: 'pct', decimals: s.decimals, dates: s.dates, values: s.values, src: src(s), comp: { [`${c}_${t}Y`]: 1 } });
    }
    for (const c of ORDER) if (c !== REF && Y[REF]) for (const t of tenors(c)) if (Y[REF][t]) {
      add({ id: `${c}-${REF}_${t}Y`, cat: 'spread', country: c, tenor: t, name: `${c}${DASH}${REF} ${t}Y`, long: `${COUNTRIES[c]} minus ${COUNTRIES[REF]}, ${t}-year`, unit: 'bp',
        ...join([Y[c][t], Y[REF][t]], (a, b) => (a - b) * 100), src: src(Y[c][t], Y[REF][t]), comp: { [`${c}_${t}Y`]: 1, [`${REF}_${t}Y`]: -1 } });
    }
    for (const c of ORDER) for (const [a, b] of SLOPES) if (Y[c] && Y[c][a] && Y[c][b]) {
      add({ id: `${c}_${a}s${b}s`, cat: 'slope', country: c, legs: `${a}s${b}s`, name: `${c} ${a}s${b}s`, long: `${COUNTRIES[c]} ${b}-year minus ${a}-year`, unit: 'bp',
        ...join([Y[c][a], Y[c][b]], (x, y) => (y - x) * 100), src: src(Y[c][a], Y[c][b]), comp: { [`${c}_${b}Y`]: 1, [`${c}_${a}Y`]: -1 } });
    }
    for (const c of ORDER) for (const [a, b, d] of FLIES) if (Y[c] && Y[c][a] && Y[c][b] && Y[c][d]) {
      add({ id: `${c}_${a}s${b}s${d}s`, cat: 'fly', country: c, legs: `${a}s${b}s${d}s`, name: `${c} ${a}s${b}s${d}s`, long: `${COUNTRIES[c]} butterfly: 2 x ${b}-year minus ${a}-year minus ${d}-year`, unit: 'bp',
        ...join([Y[c][a], Y[c][b], Y[c][d]], (x, y, z) => (2 * y - x - z) * 100), src: src(Y[c][a], Y[c][b], Y[c][d]), comp: { [`${c}_${b}Y`]: 2, [`${c}_${a}Y`]: -1, [`${c}_${d}Y`]: -1 } });
    }
    for (const c of ORDER) if (c !== REF) for (const [a, b] of SLOPES) if (Y[c] && Y[REF] && Y[c][a] && Y[c][b] && Y[REF][a] && Y[REF][b]) {
      add({ id: `${c}-${REF}_${a}s${b}s`, cat: 'box', country: c, legs: `${a}s${b}s`, name: `${c}${DASH}${REF} ${a}s${b}s box`, long: `${COUNTRIES[c]} ${a}s${b}s slope minus ${COUNTRIES[REF]} ${a}s${b}s slope`, unit: 'bp',
        ...join([Y[c][a], Y[c][b], Y[REF][a], Y[REF][b]], (ca, cb, ra, rb) => ((cb - ca) - (rb - ra)) * 100), src: src(Y[c][a], Y[c][b], Y[REF][a], Y[REF][b]), comp: { [`${c}_${b}Y`]: 1, [`${c}_${a}Y`]: -1, [`${REF}_${b}Y`]: -1, [`${REF}_${a}Y`]: 1 } });
    }
    return out;
  }
  const inst = id => BYID.get(id);
  const shown = c => S.countries.includes(c);
  const hasDaily = c => U.some(u => u.country === c && u.cat === 'outright');
  const monthly = () => DATA.market.series.filter(x => x.group === 'yield_m');
  const availCountries = () => ORDER.filter(c => hasDaily(c) || monthly().some(x => x.country === c));
  const DC = () => S.countries.filter(hasDaily);       // selected countries that have daily yields
  const dailyNames = () => { const n = ORDER.filter(hasDaily).map(c => COUNTRIES[c]); return n.length > 1 ? n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1] : n.join(''); };
  const visible = () => U.filter(u => u.cat === 'custom' || shown(u.country));
  const tenorsAvail = () => [...new Set(U.filter(u => u.cat === 'outright').map(u => u.tenor))].sort((a, b) => a - b);
  const level = u => num(u.values[u.values.length - 1], u.unit === 'pct' ? (u.decimals || 3) : 1);
  const unitLabel = u => (u.unit === 'pct' ? '%' : 'bp');
  function sourceLine(ids) {
    const names = [...new Set(ids)].map(id => { const s = (DATA.sources && DATA.sources.sources || []).find(x => x.id === id); return s ? s.short || s.name : id; });
    return names.length ? 'Source: ' + names.join(', ') + '. Details under Sources.' : '';
  }

  // ===================================================================== 5. small graphics
  /** Diverging tint: warm above zero, cool below, nothing at zero. */
  function heat(v, clamp) {
    if (!Number.isFinite(v) || !v) return 'transparent';
    const c = d3.color(v > 0 ? COL.up : COL.down); c.opacity = 0.6 * Math.min(1, Math.abs(v) / clamp);
    return c.opacity < 0.03 ? 'transparent' : c.formatRgb();
  }
  const zDot = z => (!Number.isFinite(z) || Math.abs(z) < 1 ? COL.ink2 : z > 0 ? COL.up : COL.down);

  /** Where the latest value sits in its window: min to max track, mean tick, band of one standard deviation, dot for today. */
  function rangeBar(st, w) {
    w = w || 108;
    if (!st || !Number.isFinite(st.min) || st.max === st.min) return '';
    const x = v => 6 + (w - 12) * (v - st.min) / (st.max - st.min);
    const lo = Math.max(st.min, st.mean - st.sd), hi = Math.min(st.max, st.mean + st.sd);
    return `<svg width="${w}" height="16" viewBox="0 0 ${w} 16" role="img" aria-label="Range position"><line x1="6" x2="${w - 6}" y1="8" y2="8" stroke="${COL.axis}"/>` +
      `<rect x="${x(lo).toFixed(1)}" y="5" width="${Math.max(1, x(hi) - x(lo)).toFixed(1)}" height="6" fill="${COL.flat}"/>` +
      `<line x1="${x(st.mean).toFixed(1)}" x2="${x(st.mean).toFixed(1)}" y1="3" y2="13" stroke="${COL.ink3}"/>` +
      `<circle cx="${x(st.last).toFixed(1)}" cy="8" r="4" fill="${zDot(st.z)}" stroke="${COL.surface}" stroke-width="2"/></svg>`;
  }
  function spark(values, w, hgt) {
    w = w || 84; hgt = hgt || 20;
    if (values.length < 2) return '';
    const x = d3.scaleLinear().domain([0, values.length - 1]).range([2, w - 5]), ext = d3.extent(values);
    const y = d3.scaleLinear().domain(ext[0] === ext[1] ? [ext[0] - 1, ext[1] + 1] : ext).range([hgt - 3, 3]);
    const path = d3.line().x((d, i) => x(i)).y(d => y(d))(values), L = values.length - 1;
    return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true"><path d="${path}" fill="none" stroke="${COL.ink3}" stroke-width="1.25" stroke-linejoin="round"/>` +
      `<circle cx="${x(L).toFixed(1)}" cy="${y(values[L]).toFixed(1)}" r="2.5" fill="${COL.ink}"/></svg>`;
  }
  function zChip(z) {
    return h('span', { class: 'zchip', style: 'background:' + heat(z, 3), title: 'Z-score of the level over the selected window' }, num(z, 2, true));

        h('li', null, h('code', null, 'Carry in a backtest'), ' = optional. A long position in a structure gains when it rises and pays the carry and roll-down of its yield legs, by calendar day. Carry = (yield minus euro short-term rate) / modified duration; roll-down = slope of the curve down to the next shorter maturity. Duration is the maturity itself when the yield is not positive. These are estimates from constant-maturity curves, not figures bond by bond.'),

  // ===================================================================== 7.0 brief: the latest fixings in one screen
  // Every word and every number of the daily note is produced from the data files when the page loads.
  // Nothing is typed by hand, nothing is a forecast or an opinion. tests/ recomputes the same sentences in Python.
  const BOND = { DE: 'Bunds', FR: 'OATs', IT: 'BTPs', ES: 'Bonos', NL: 'DSLs', BE: 'OLOs', AT: 'RAGBs', PT: 'PGBs' };
  const REPO = 'https://github.com/arthurmarc1102-droid/egb-dashboard';

  const bpw = x => trim1(x) + ' bp';                                 // size of a move, in words: 4 bp, 6.5 bp
  const lv = x => (x < 0 && Number(Math.abs(x).toFixed(1)) !== 0 ? MINUS : '') + trim1(x);   // a level in bp: 26, 145.6, −5

  /** The benchmark curve of one country in one sentence, from the day's moves in its 2-year and 10-year yields.
      Desk vocabulary: bull = yields lower, bear = yields higher; steeper or flatter = 2s10s wider or narrower;
      twist = the two ends move by at least 1 bp in opposite directions; parallel = 2s10s unchanged. */
  function closeSentence(c) {
    const b = inst(`${c}_10Y`), a = inst(`${c}_2Y`), sl = inst(`${c}_2s10s`);

    const d10 = change(b, 1);
    const ten = still(d10) ? `the 10-year yield was unchanged at ${level(b)} %` : `the 10-year yield ${d10 < 0 ? 'fell' : 'rose'} ${bpw(d10)} to ${level(b)} %`;
    const late = dateOf(b) < lastDate() ? ` Data to ${fShort(parseD(dateOf(b)))}.` : '';          // this curve has no value yet for the page's date
    if (!a || !sl || dateOf(a) !== dateOf(b)) return `${BOND[c]}${still(d10) ? '' : d10 < 0 ? ' rallied' : ' sold off'}: ${ten}.${late}`;   // one point only: no verdict on the whole curve when it did not move
    const d2 = change(a, 1), ds = change(sl, 1), mid = (d2 + d10) / 2, shape = still(ds) ? '' : ds > 0 ? 'steepened' : 'flattened';
    let verb;
    if (still(d2) && still(d10)) verb = '';                                  // other maturities may have moved: state the two facts, no verb
    else if (d2 * d10 < 0 && Math.abs(d2) >= 0.95 && Math.abs(d10) >= 0.95) verb = 'twist-' + shape;
    else if (!shape) verb = (mid < 0 ? 'rallied' : 'sold off') + ' in a parallel move';
    else verb = still(mid) ? shape : (mid < 0 ? 'bull-' : 'bear-') + shape;
    return `${BOND[c]}${verb ? ' ' + verb : ''}: ${ten}, 2s10s ${still(ds) ? 'unchanged' : bpw(ds) + (ds > 0 ? ' steeper' : ' flatter')} at ${lv(lastOf(sl))} bp.${late}`;
  }
  /** Spread of one country to Germany: level, move of the day, z-score on the selected window. */
  function spreadSentence(c, n) {
    const u = inst(`${c}-${REF}_10Y`) || U.find(x => x.cat === 'spread' && x.country === c);
    if (!u || u.values.length < 2) return null;

    return { u, text: `${u.tenor}-year spread to Germany ${lv(st.last)} bp, ${still(d) ? 'unchanged' : bpw(d) + (d > 0 ? ' wider' : ' tighter')}` +
      (Number.isFinite(st.z) ? `, ${S.win} z-score ${num(st.z, 2, true)}` : '') + (dateOf(u) < lastDate() ? `. Data to ${fShort(parseD(dateOf(u)))}.` : '.') };
  }
  /** Long end and belly of one curve. A butterfly that rises means the body yield rose against the wings: the belly cheapened. */
  function shapeSentence(c) {

  /** Text to nodes, keeping "10-year", "4 bp", "3.31 %" and "3M z-score +0.73" unbroken at line ends. */
  function nb(text) {

    if (i < text.length) out.push(text.slice(i));

  }
  const stretched = n => visible().filter(u => u.cat !== 'outright').map(u => ({ u, st: stats(u, n) })).filter(o => Number.isFinite(o.st.z)).sort((a, b) => Math.abs(b.st.z) - Math.abs(a.st.z));
  function futureSentence() {

  // ---------- what comes next: auctions of the selected countries, the next ECB decision, first-tier euro-area data

  // ---------- largest moves of the day, measured against the usual size of a daily move
  /** Last daily change in bp, and the same in standard deviations of the last n daily changes (today's included). */
  function dayMove(u, n) {
    const L = u.values.length, k = u.unit === 'pct' ? 100 : 1; if (L < 22) return null;
    const ch = []; for (let i = Math.max(1, L - n); i < L; i++) ch.push((u.values[i] - u.values[i - 1]) * k);
    const sd = d3.deviation(ch), d1 = ch[ch.length - 1];

  /** One row per family (a country's benchmark yields, its spreads to Germany, its slopes): the family's largest move, then the k largest of those.
      Without the grouping, five maturities of one curve moving together would fill the list. */
  function movers(n, k) {
    const close = lastDate(), best = new Map();
    for (const u of visible()) {
      if (!(u.cat === 'slope' || ((u.cat === 'outright' || u.cat === 'spread') && HEADLINE.includes(u.tenor))) || dateOf(u) !== close) continue;
      const m = dayMove(u, n); if (!m || still(m.d1)) continue;
      const key = u.country + ' ' + u.cat, cur = best.get(key);
      if (!cur || Math.abs(m.score) > Math.abs(cur.m.score)) best.set(key, { u, m });
    }
    return [...best.values()].sort((a, b) => Math.abs(b.m.score) - Math.abs(a.m.score)).slice(0, k);
  }
  function panelMovers(span) {
    const n = WINDOWS[S.win], list = movers(n, 5);

      foot: `Families: a country's 2, 5, 10 and 30-year yields, its spreads to Germany, its slopes. Std dev = 1-day change divided by the standard deviation of the last ${n} daily changes. Butterflies and boxes are left out because German yields are published to the basis point.` },
      list.length ? h('div', { class: 'scroll' }, h('table', { class: 't' },

          heatCell(bp(m.d1), m.d1, HEAT_BP['1D']), h('td', null, num(m.score, 1, true)))))))

  }

  // ---------- curve ladder: the curves at the latest fixing, with the table underneath sharing the chart's columns
  const LADDER = [1, 2, 3, 5, 7, 10, 15, 20, 30];
  const ladderTenors = (cs, narrow) => {
    const t = (narrow ? [2, 5, 10, 30] : LADDER).filter(x => cs.some(c => inst(`${c}_${x}Y`)));
    return t.length >= 2 ? t : tenorsAvail().filter(x => cs.some(c => inst(`${c}_${x}Y`))).slice(0, narrow ? 4 : 9);
  };
  /** Each maturity is a band of equal width: the dot of the chart sits right above its yield and its change in the table. */
  function ladder(host, cs) {

    const lab = narrow ? 60 : 118, cw = (W - lab) / tenors.length, H = narrow ? 170 : 216, m = { t: 14, b: 10 }, X = i => lab + (i + 0.5) * cw;
    const rows = cs.map(c => ({ c, p: tenors.map((t, i) => { const u = inst(`${c}_${t}Y`); return u ? { i, t, u, v: lastOf(u), d: change(u, hz) } : null; }) })).filter(r => r.p.some(Boolean));
    const vals = rows.flatMap(r => r.p.filter(Boolean).map(p => p.v)); let lo = d3.min(vals), hi = d3.max(vals); if (lo === hi) { lo -= .1; hi += .1; }

      svg.append('g').selectAll('circle').data(pts).join('circle').attr('cx', p => X(p.i)).attr('cy', p => y(p.v)).attr('r', 4).attr('fill', COL[r.c]).attr('stroke', COL.surface).attr('stroke-width', 2);

      h('thead', null, h('tr', null, h('th', null, 'Maturity'), tenors.map((t, i) => keep(i, h('th', null, t + 'Y'))))),
      h('tbody', null, rows.map(r => [
        h('tr', { class: 'lv' }, h('td', null, narrow ? ctry(r.c) : ctryRow(r.c)), r.p.map((p, i) => keep(i, p ? h('td', { class: 'lvl' }, level(p.u)) : h('td', { class: 'muted' }, DASH)))),
        h('tr', { class: 'chg' }, h('td', { class: 'muted' }, S.horizon + ', bp'), r.p.map((p, i) => keep(i, p ? heatCell(bp(p.d), p.d, HEAT_BP[S.horizon]) : h('td', { class: 'muted' }, DASH))))])));

  function viewHome() {
    const dc = DC(), n = WINDOWS[S.win], focus = dc.includes(REF) ? REF : dc[0];

        SCAN ? csvButton('backtest_scan', () => ({ head: ['structure', 'total_bp', 'per_year_bp', 'trades', 'hit_ratio', 'avg_trade_bp', 'max_drawdown_bp', 'sharpe'], rows: SCAN.rows.map(({ u: x, r: q }) => [x.name, +q.total.toFixed(2), +(q.perYear || 0).toFixed(2), q.trades.length, +(q.hit || 0).toFixed(3), +(q.avg || 0).toFixed(2), +q.mdd.toFixed(2), +(q.sharpe || 0).toFixed(2)]) })) : null] },
      SCAN ? h('div', { class: 'scroll', style: 'max-height:360px;overflow-y:auto' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['Structure', 'Total', 'Per year', 'Trades', 'Hit', 'Max DD', 'Sharpe'].map(x => h('th', null, x)))),
        h('tbody', null, SCAN.rows.map(({ u: x, r: q }) => h('tr', { class: 'click', 'aria-selected': String(x.id === S.btSel), onclick: () => set({ btSel: x.id }) }, h('td', null, h('span', { class: 'name' }, x.name)), heatCell(bp(q.total), q.total, 200), h('td', null, bp(q.perYear)), h('td', null, String(q.trades.length)), h('td', null, num(q.hit * 100, 0) + ' %'), h('td', null, num(q.mdd, 0)), h('td', null, num(q.sharpe, 2))))))) : h('div', { class: 'empty' }, 'The scan runs the current rules on every structure: about one second.'));
    // walk-forward: rules chosen on the past only
    const wf = Object.assign({ train: 504, test: 126 }, S.wf || {}), wfKey = JSON.stringify([u.id, u.values.length, p, wf]), W = WFRES && WFRES.key === wfKey ? WFRES.res : null;
    const col = COL[u.country] || COL.DE, span = b => `${fShort(parseD(b.from))} ${b.from.slice(2, 4)} to ${fShort(parseD(b.to))} ${b.to.slice(2, 4)}`;
    let wfBody;
    if (!W) wfBody = h('div', { class: 'empty' }, `Click Run walk-forward. Before each block, the ${WF_WINS.length * WF_ENTS.length} pairs of z window and entry level are tested on the training span, and the best one is traded on the block: about one second.`);
    else if (!W.blocks.length) wfBody = h('div', { class: 'empty' }, `Not enough history for these settings: the test needs ${W.need} fixings (the longest z window, the training span and a first block) and this period has ${W.have}. Shorten the training span or widen the dates.`);
    else {
      const hw = h('div'), a = { name: 'Walk-forward', color: col, dates: W.equity.dates, values: W.equity.values }, i0 = W.fixed.equity.dates.indexOf(W.start);

          stat('Sharpe (daily, annualised)', num(W.sharpe, 2)), stat('Max drawdown', num(W.mdd, 1), 'bp'), stat('Blocks with a rule', `${W.traded} of ${W.blocks.length}`),
          stat('Rules of the screen', bp(W.fixed.total), 'bp'), W.hind ? stat('Best pair in hindsight', bp(W.hind.r.total), 'bp') : null, W.carry != null ? stat('Of which carry', bp(W.carry), 'bp') : null),
        h('p', { class: 'muted', style: 'font-size:12px;margin:8px 0 10px' }, `Out of sample from ${day(W.start)} to ${day(W.end)}. Rules of the screen: z on ${p.win} days, entry at ${p.entry}, traded over the same dates.` +
          (W.hind ? ` Best pair in hindsight: ${W.hind.win} days and entry at ${W.hind.entry}, the best Sharpe ratio on the same dates, picked after the fact. Nobody could have traded it: it is there for scale.` : '')),
        hw,
        h('div', { class: 'scroll', style: 'max-height:320px;overflow-y:auto;margin-top:10px' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['Block', 'Z window', 'Entry |z|', 'Training Sharpe', 'Trades', 'P&L'].map(x => h('th', null, x)))),
          h('tbody', null, W.blocks.map(b => h('tr', null, h('td', null, h('span', { class: 'name' }, span(b))), h('td', null, b.pick ? b.pick.win + ' days' : DASH), h('td', null, b.pick ? String(b.pick.entry) : DASH),
            h('td', null, b.pick ? num(b.pick.sharpe, 2) : h('span', { class: 'muted' }, 'no pair qualified')), h('td', null, String(b.trades)), b.pick ? heatCell(bp(b.pnl), b.pnl, 40) : h('td', { class: 'muted' }, 'not traded')))))) ];
    }

          rows: W.blocks.map(b => [b.from, b.to, b.pick ? b.pick.win : '', b.pick ? b.pick.entry : '', b.pick ? +b.pick.sharpe.toFixed(3) : '', b.pick ? b.pick.trades : '', b.trades, +b.pnl.toFixed(2)]) })) : null],
      foot: `Pairs tested before each block: z window of ${WF_WINS.join(', ')} days with entry at ${WF_ENTS.join(', ')}. The pair kept has the best Sharpe ratio on the training span, with at least ${WF_MIN} trades and a Sharpe ratio above zero; otherwise the block is not traded. Exit, stop, holding limit, side, cost${p.carry ? ', carry' : ''} and execution are those set above. A trade still open at the end of a block is closed there. The first block starts after ${WF_WINS[WF_WINS.length - 1]} fixings plus the training span.` },
      h('div', { class: 'controls' },
        field('Training span', seg([[252, '1Y'], [504, '2Y'], [756, '3Y']], wf.train, v => set({ wf: { ...wf, train: v } }), 'Training span')),
        field('Test block', seg([[63, '3M'], [126, '6M'], [252, '1Y']], wf.test, v => set({ wf: { ...wf, test: v } }), 'Length of a test block'))),

    return h('div', { class: 'grid' }, ctl, st, eqP, sig, trP, sens, scanP, wfP);
  }


  // ===================================================================== 8. shell
  const root = () => document.getElementById('view');
  function hasGroup(g) { return DATA.market && DATA.market.series.some(s => s.group === g); }
  const tabOK = id => !!TAB[id] && (id === 'rates' ? hasGroup('mm') : id === 'futures' ? !!(DATA.futures && DATA.futures.products && DATA.futures.products.length) : true);
  const spaceOf = tab => SPACES.find(s => s[3].includes(tab)) || SPACES[0];
  let filtersOpen = false;                             // phone only: the filter row folds into one button

  function renderShell() {
    const sp = spaceOf(S.tab), need = TAB[S.tab][2];
    document.getElementById('spaces').replaceChildren(...SPACES.filter(s => s[3].some(tabOK)).map(([id, name, short, tabs]) =>
      h('button', { class: 'space', type: 'button', id: 'space-' + id, 'aria-current': sp[0] === id ? 'page' : null, 'aria-label': name, 'data-tabs': tabs.filter(tabOK).join(','),
        onclick: () => go(S.last && tabs.includes(S.last[id]) && tabOK(S.last[id]) ? S.last[id] : tabs.find(tabOK)) }, h('span', { class: 'long' }, name), h('span', { class: 'short' }, short))));
    const tabs = sp[3].filter(tabOK), bar = document.getElementById('tabs');
    bar.hidden = tabs.length < 2; bar.parentNode.classList.toggle('solo', tabs.length < 2);
    bar.replaceChildren(...(tabs.length < 2 ? [] : tabs.map(id => h('button', { class: 'tab', role: 'tab', type: 'button', id: 'tab-' + id, 'aria-selected': String(S.tab === id), onclick: () => go(id) }, TAB[id][0]))));
    const on = bar.querySelector('[aria-selected="true"]'); if (on && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = on.offsetLeft - (bar.clientWidth - on.offsetWidth) / 2;   // keep the open section in sight on a phone
    document.getElementById('about').textContent = TAB[S.tab][1];
    document.title = (S.tab === 'home' ? '' : TAB[S.tab][0] + ' | ') + 'EGB Dashboard';

    const avail = availCountries(), groups = [];
    const toggle = c => { const cur = S.countries.includes(c) ? S.countries.filter(x => x !== c) : ORDER.filter(x => S.countries.includes(x) || x === c); if (cur.length) set({ countries: cur }); };
    if (need.includes('countries')) groups.push(h('div', { class: 'fgroup' }, h('span', { class: 'flabel' }, 'Countries'), h('div', { class: 'seg', role: 'group', 'aria-label': 'Countries shown' },
      avail.map(c => h('button', { type: 'button', 'aria-pressed': String(S.countries.includes(c)), title: COUNTRIES[c] + (hasDaily(c) ? '' : ': monthly data only'), onclick: () => toggle(c) }, h('i', { class: 'swatch', style: 'background:' + COL[c] }), c)))));
    if (need.includes('win')) groups.push(h('div', { class: 'fgroup' }, h('span', { class: 'flabel' }, 'Z-score window'), seg(Object.keys(WINDOWS).map(k => [k, k]), S.win, v => set({ win: v }), 'Z-score window')));
    if (need.includes('range')) groups.push(h('div', { class: 'fgroup' }, h('span', { class: 'flabel' }, 'Chart range'),
      seg(Object.keys(RANGES).map(k => [k, k]), S.range, v => set(v === 'Custom' && !S.from ? { range: v, from: d3.timeFormat('%Y-%m-%d')(d3.timeYear.offset(new Date(), -3)) } : { range: v }), 'Chart range'),
      S.range === 'Custom' ? h('span', { class: 'daterange' }, h('input', { class: 'inp', type: 'date', value: S.from || '', 'aria-label': 'Chart range from', onchange: e => set({ from: e.target.value }) }), h('span', { class: 'muted' }, 'to'), h('input', { class: 'inp', type: 'date', value: S.to || '', 'aria-label': 'Chart range to (empty: latest)', onchange: e => set({ to: e.target.value }) })) : null));
    const f = document.getElementById('filters'); f.hidden = !groups.length; f.classList.toggle('open', filtersOpen);
    const summary = [need.includes('countries') ? S.countries.join(' ') : null, need.includes('win') ? 'z ' + S.win : null, need.includes('range') ? 'range ' + (S.range === 'Custom' ? 'by dates' : S.range) : null].filter(Boolean).join(', ');
    f.replaceChildren(h('button', { class: 'ftoggle', type: 'button', 'aria-expanded': String(filtersOpen), 'aria-controls': 'filters', onclick: () => { filtersOpen = !filtersOpen; renderShell(); } }, h('span', null, 'Filters'), h('span', { class: 'muted' }, summary)), ...groups,
      h('div', { class: 'legend-key fkey' }, h('span', null, h('i', { class: 'k-up' }), 'higher, wider, cheaper'), h('span', null, h('i', { class: 'k-down' }), 'lower, tighter, richer')));
  }
  function render() {
    redraws.length = 0; if (!tabOK(S.tab)) S.tab = 'home'; renderShell();
    const v = { home: viewHome, builder: viewBuilder, curvelab: viewCurveLab, backtest: viewBacktest, monitor: viewMonitor, curves: viewCurves, rv: viewRV, analysis: viewAnalysis, auctions: viewAuctions, blotter: viewBlotter, sources: viewSources,

    let node;
    try { node = v(); } catch (e) {
      // A screen that fails says so and offers the usual cure (settings saved by an older version); the error still reaches the console.
      node = h('div', { class: 'grid' }, panel({ id: 'p-error', title: 'This screen could not be drawn' },
        h('div', { class: 'empty' }, 'Something in the saved settings or in today\'s data stopped this screen. Resetting the settings usually fixes it; saved structures are kept.'),
        h('div', { class: 'row-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { try { localStorage.removeItem('egb-state'); } catch (x) { /* nothing to reset */ } location.hash = ''; location.reload(); } }, 'Reset settings and reload'),
          h('a', { href: '#home' }, 'Back to the brief'))));

  /** Open a section, optionally with a state patch (a selected structure, for instance). The address follows, so Back works. */
  function go(tab, patch) {
    if (!tabOK(tab)) tab = 'home';
    if (location.hash.replace('#', '').split('/')[0] !== tab) { try { history.pushState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }

    set(Object.assign({}, patch, { tab })); window.scrollTo(0, 0);
  }
  function fromHash() {

  }
  /** Business days from one ISO date to another (weekends only: holidays are not known here). */
  function bizDays(a, b) { let n = 0; for (let d = parseD(a); d < parseD(b);) { d = new Date(+d + 864e5); if (d.getUTCDay() % 6) n++; } return n; }

  async function loadJSON(name) { try { const r = await fetch('data/' + name + '.json', { cache: 'no-cache' }); return r.ok ? await r.json() : null; } catch (e) { return null; } }

  async function start() {
    for (const c of ORDER) COL[c] = css('--c-' + c);
    Object.assign(COL, { up: css('--up'), down: css('--down'), flat: css('--flat'), ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'), rule: css('--rule'), axis: css('--axis'), surface: css('--surface') });
    const [market, auctions, news, events, sources, futures] = await Promise.all(['market', 'auctions', 'news', 'events', 'sources', 'futures'].map(loadJSON));
    Object.assign(DATA, { market, auctions, news, events, sources, futures });
    if (!market || !market.series || !market.series.length) {
      root().replaceChildren(h('div', { class: 'grid' }, panel({ id: 'p-missing', title: 'Market data did not load' },
        h('div', { class: 'empty' }, 'The page could not read its data file, so there is nothing to show yet. Check the connection and reload. If it still fails, the daily update may be running: try again in a few minutes.'),
        h('div', { class: 'row-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => location.reload() }, 'Reload')))));

    }

    const avail = availCountries();
    S.countries = (S.countries || avail).filter(c => avail.includes(c)); if (!S.countries.length) S.countries = avail;
    const tn = tenorsAvail(); if (!tn.includes(S.tenor)) S.tenor = tn.includes(10) ? 10 : tn[tn.length - 1];
    const id = location.hash.replace('#', '').split('/')[0]; S.tab = tabOK(id) ? id : 'home';      // no address: open on the brief
    const last = lastDate(), st = market.status || '', gap = bizDays(last, new Date().toISOString().slice(0, 10));
    document.getElementById('asof').replaceChildren(h('span', { class: 'pre' }, 'Fixings of '), h('b', null, fDow(parseD(last))));

    document.getElementById('status').replaceChildren(...(warn ? [h('span', { class: 'pill warn', title: st }, warn)] : []));
    document.getElementById('foot').replaceChildren(h('p', null, market.footer || ''),
      h('p', null, st ? st + ' ' : '', 'Built by Arthur Marc. ', h('a', { href: REPO, target: '_blank', rel: 'noopener' }, 'Code and data pipeline on GitHub'), '. ', h('a', { href: '#sources' }, 'Sources and methods'), '.'));
    render();
    window.addEventListener('hashchange', fromHash); window.addEventListener('popstate', fromHash);

    new ResizeObserver(() => { const nw = root().clientWidth; if (nw === w) return; w = nw; clearTimeout(timer); timer = setTimeout(() => redraws.forEach(fn => fn()), 120); }).observe(root());
  }
  start();
})();
