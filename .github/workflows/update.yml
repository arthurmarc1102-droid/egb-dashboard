name: daily update
on:
  schedule:
    - cron: '17 19 * * 1-5'   # evening run, after Eurex settlement and the Banque de France export
    - cron: '23 6 * * 2-6'    # morning run, for sources published overnight
  push:
    paths: ['pipeline/**', '.github/workflows/update.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download and build data
        run: python pipeline/update.py
      - name: Sources and limits
        run: python pipeline/sources.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase -q origin main
          git push
