name: daily update
on:
  schedule:
    - cron: '17 19 * * 1-5'   # evening run, after Eurex settlement and the Banque de France export
    - cron: '23 6 * * 2-6'    # morning run, for sources published overnight
  push:
    paths: ['pipeline/**', '!pipeline/probe.py', 'tests/**', 'src/**', 'index.html', '.github/workflows/update.yml']
  workflow_dispatch:
# one data update at a time: a second run waits, so two runs never publish over each other
concurrency:
  group: data-update
  cancel-in-progress: false
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install openpyxl pypdf numpy
      - name: Download and build data
        run: python pipeline/update.py
      - name: Sources and limits
        run: python pipeline/sources.py
      - name: Check the data
        run: python pipeline/verify.py
      - name: Check the page in a browser
        run: |
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
          PREVIEW=preview.png node pipeline/page_check.mjs .
      - name: Check the brief and the lab figures against an independent Python implementation
        run: |
          sh tests/run_lab_check.sh
          tail -1 /tmp/lab_check.txt | sed 's/^/OK    brief and lab: /' >> data/raw/verify.txt
      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ preview.png
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase -q origin main || { git rebase --abort; echo "Newer data were published while this run was working: nothing to publish."; exit 0; }
          git push
      - name: Keep the logs when a check fails (data not published)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -q -- data/raw/update_log.txt data/raw/verify.txt 2>/dev/null || true
          git checkout -q -- data/ 2>/dev/null || true
          git stash pop -q 2>/dev/null || true
          git add data/raw/update_log.txt data/raw/verify.txt
          git commit -m "Checks failed $(date -u +'%Y-%m-%d %H:%M') UTC: logs only, data not published" || exit 0
          git pull --rebase -q origin main
          git push
