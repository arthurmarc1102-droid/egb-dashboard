se options under the 'Customise' menu.{br}{br}\u003cb\u003eThe columns represent time periods but they are not ordered chronologically?\u003c/b\u003e{br}The bar chart is being used to compare the statistical values of different categories, and in order to ease this comparison, columns are always ordered ascending by the statistical values. If you intent to visualise a chronological trend then use the timeline chart instead. Note that the stacked bar chart (with only one variable per bar) would be another alternative if columns are absolutely required.{br}{br}\u003cb\u003eSeveral dimensions are combined per bar?\u003c/b\u003e{br}If your selection varies for more than one of the dimensions, then the columns will represent all possible combinations of the selected dimension items. If you want to compare the values of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe columns do not contain the desired items?\u003c/b\u003e{br}Make sure to include in your selection only the required dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.choro":"\u003cb\u003eThe map is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Maps need data covering at least 1 data point. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe map is not showing the intended variable?\u003c/b\u003e{br}Maps need exactly 1 data point per map object. Adapt the currently selected dimension items. Available data points can be checked with the 'Table' tab.{br}{br}\u003cb\u003eThe chart doesn't have the desired size?\u003c/b\u003e{br}Use the chart size customisation options that you'll find under the 'Customise' menu. Note that the zooming scale is currently not customisable.{br}{br}\u003cb\u003eThe chart doesn't have the desired colour scale?\u003c/b\u003e{br}Unfortunately, the colour scale is currently not customisable.","viewer.guidance.hsymbol":"\u003cb\u003eThe symbol series do not contain the desired items?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for symbols)' that contains the items to be displayed as symbol series.{br}{br}\u003cb\u003eAll symbol series are grey and cannot be distinguished?\u003c/b\u003e{br}Symbol series are only coloured if especially highlighted, otherwise their purpose is to provide a general overview of all the values. Use the highlight feature under the 'Customise' menu to choose the symbol series for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe symbol series are not labelled?\u003c/b\u003e{br}Symbol series are only labelled if there is enough space for those labels. Increase the chart height until labels are displayed or reduce the selection. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per symbol series?\u003c/b\u003e{br}If your selection varies for more than two of the dimensions, then the symbol series will represent all possible combinations of the selected dimension items. If you want to compare the symbol series of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.row":"\u003cb\u003eAll rows are grey and cannot be distinguished?\u003c/b\u003e{br}Rows are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview of all the categories. Use the highlight feature under the 'Customise' menu to choose the rows for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe rows are not labelled?\u003c/b\u003e{br}Rows are only labelled if there is enough space for those labels. Increase the chart height until labels are displayed or reduce the selection. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e or \u003cb\u003eNo rows are shown?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per row?\u003c/b\u003e{br}If your selection varies for more than one of the dimensions, then the rows will represent all possible combinations of the selected dimension items. If you want to compare the values of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe rows do not contain the desired items?\u003c/b\u003e{br}Make sure to include in your selection only the required dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.scatter":"\u003cb\u003eThe horizontal and/or vertical scatter axes do not contain the desired variables?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for X and Y axes)' that contains the to be compared variables (items). Also select the corresponding dimension items to be compared as 'Dimension value for X-axis' and 'Dimension value for Y-axis'.{br}{br}\u003cb\u003eThe chart shows only one dot?\u003c/b\u003e{br}Scatter plot compare the varying values of one (or more) dimension(s) for one item of another dimension against another item of that dimension. Therefore, scatter plot require multiple selections in at least two dimensions. Make sure that your selection is adequate. Use the 'Table' to check also data availability.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 1 data point. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eAll dots are grey and cannot be distinguished?\u003c/b\u003e{br}Dots are only coloured if especially highlighted, otherwise their purpose is to provide a general distribution overview allowing to identify the type of relationship between the plotted variables. Use the highlight feature under the 'Customise' menu to choose the dimension items for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.stacked-bar":"\u003cb\u003eThe stacked columns do not represent the intended categories and variables?\u003c/b\u003e{br}The stacked column chart is being used to compare several statistical values for different categories. Use the 'Customise' menu to choose the dimension used to distinguish the stacked columns as 'Chart series (dimension for X-axis)'. The column segments will represent all possible combinations of the other selected dimension items (with a limitation of 5 segments maximum). Reduce the selection to only two varying dimensions if the segments should represent the items of one single dimension.{br}{br}\u003cb\u003eAll stacked columns are shaded in grey and cannot be distinguished?\u003c/b\u003e{br}Stacked columns are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview for the values of all the categories. Use the highlight feature under the 'Customise' menu to choose the stacked columns for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant. The shading scheme cannot be changed.{br}{br}\u003cb\u003eThe stacked columns are not labelled?\u003c/b\u003e{br}Stacked columns are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eYou wanted a percentage stacked column chart?\u003c/b\u003e{br}Use the 'Percentage' customisation option that you'll find under the 'Customise' menu. This chart type allows comparing shares across a dimension.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Stacked column charts need data covering at least 2 data points. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.stacked-row":"\u003cb\u003eThe stacked rows do not represent the intended categories and variables?\u003c/b\u003e{br}The stacked row chart is being used to compare several statistical values for different categories. Use the 'Customise' menu to choose the dimension used to distinguish the stacked rows as 'Chart series (dimension for Y-axis)'. The row segments will represent all possible combinations of the other selected dimension items (with a limitation of 5 segments maximum). Reduce the selection to only two varying dimensions if the segments should represent the items of one single dimension.{br}{br}\u003cb\u003eAll stacked rows are shaded in grey and cannot be distinguished?\u003c/b\u003e{br}Stacked rows are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview for the values of all the categories. Use the highlight feature under the 'Customise' menu to choose the stacked rows for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant. The shading scheme cannot be changed.{br}{br}\u003cb\u003eThe stacked rows are not labelled?\u003c/b\u003e{br}Stacked rows are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eYou wanted a percentage stacked row chart?\u003c/b\u003e{br}Use the 'Percentage' customisation option that you'll find under the 'Customise' menu. This chart type allows comparing shares across a dimension.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Stacked row charts need data covering at least 2 data points. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.timeline":"\u003cb\u003eAll lines are grey and cannot be distinguished?\u003c/b\u003e{br} Timelines are only coloured if especially highlighted, otherwise their purpose is to provide a general trend overview of all the timelines. Use the highlight feature under the 'Customise' menu to choose the timelines for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe lines are not labelled?\u003c/b\u003e{br}Lines are only labelled if especially highlighted. Use the highlight feature under the 'Customise' menu to choose the timelines for which you would like to see labels.{br}{br}\u003cb\u003eThe highlighted timelines do not show dots for values?\u003c/b\u003e{br}Dots on timelines are only shown if there is sufficient horizontal space that allow well distinguishing the dots. Increase the chart width or reduce the time period range selection.{br}{br}\u003cb\u003eSeveral dimensions are combined per timeline?\u003c/b\u003e{br}If, apart the time dimension, your selection varies for more than one of the dimensions, then the timelines will represent all possible combinations of the selected dimension items. If you want to compare the timelines of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Timeline charts need data covering at least 2 time periods. Check and increase the currently selected time range.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.vsymbol":"\u003cb\u003eThe symbol series do not contain the desired items?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for symbols)' that contains the items to be displayed as symbol series.{br}{br}\u003cb\u003eAll symbol series are grey and cannot be distinguished?\u003c/b\u003e{br}Symbol series are only coloured if especially highlighted, otherwise their purpose is to provide a general overview of all the values. Use the highlight feature under the 'Customise' menu to choose the symbol series for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe symbol series are not labelled?\u003c/b\u003e{br}Symbol series are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed.  Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per symbol series?\u003c/b\u003e{br}If your selection varies for more than two of the dimensions, then the symbol series will represent all possible combinations of the selected dimension items. If you want to compare the symbol series of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidances.chart":"You did not get the expected chart?","viewer.guidances.table":{},"viewer.no.id":"There is no shared view ID provided in the URL.","vis.data.availability.disabled":"Due to the large size of this dataset, we are not able to indicate unavailability of data for certain filter selections.","vx.config.copyright":"Remove the copyright","vx.config.display.both":"Both","vx.config.display.code":"Identifier","vx.config.display.label":"Name","vx.config.logo":"Remove the logo","vx.config.reset":"Reset","vx.config.source":"Source label","vx.config.subtitle":"Subtitle","vx.config.title":"Title","vx.config.uniq.focus.option":"Timeline","vx.filter.all.selection":"Select All","vx.filter.apply":"Apply","vx.filter.branch.selection":"Whole branch","vx.filter.children.selection":"Item and all items directly below","vx.filter.chips.all.items":"All items","vx.filter.chips.n.items":"{count} items","vx.filter.chips.remove.all":"Remove all","vx.filter.chips.show.less":"Show less","vx.filter.chips.show.more":"Show more","vx.filter.close":"Cancel","vx.filter.colapse.all":"Collapse All","vx.filter.deselect.all":"Deselect All","vx.filter.expand.all":"Expand All","vx.filter.level.selection":"All items at the same level","vx.filter.selectin.hint":"Did you already know that you can select several items either{br}by holding the mouse button while selecting neighbored items or{br}by holding the 'Shift' key while selecting the last neighbored item or{br}by holding the 'Ctrl' key while selecting the next individual item(s)?","vx.filter.selectin.mode":"Change selection mode","vx.filter.single.selection":"Single item","vx.filters.current.clear":"Clear all filters","vx.filters.current.title":"Applied filters","vx.no.data":"There is currently no da hemin d'accès au fichier (serveur de fichiers ou URL).","upload.data.log.registered":"Opération enregistrée sous le numéro de journal {logId}. Veuillez consulter les journaux pour suivre son déroulement.","upload.data.mode":"Mode de téléchargement","upload.data.mode.create":"Créer","upload.data.mode.update":"Mise à jour  ","upload.data.publicationTime":"Date de publication","upload.data.status.error":"Erreur  ","upload.data.status.success":"Succès","upload.data.success":"Espace {label}: L'import des données a été soumis. Vous devriez recevoir un email quand l'import a été traité.","upload.data.title":"Import de données ou métadonnées","upload.data.type.data":"Données ","upload.data.type.referentialMetadata":"Métadonnées de référence","upload.data.warning":"Espace {label}: L'import des données a été soumis avec avertissement. Vous devriez recevoir un email quand l'import a été traité.","upload.exceed.oversize.limit":"(Fichier trop grand - Limite actuelle de {size})","upload.file.add":"Ajouter un fichier… (taille maximale du fichier : {size})","upload.files":"Fichiers","upload.files.add":"Ajouter des fichiers… (taille maximale du fichier : {size})","upload.files.add.help":"Vous pouvez aussi glisser/déposer des fichiers dans la zone pointillée","upload.mode.EXCEL_EDD":"Fichiers Excel et EDD","upload.mode.SDMX_CSV":"Fichier SDMX","upload.path":"Chemin de ficher","upload.path.checkbox":"Utilisez un chemin de fichier d'un répertoire partagé accessible par le moteur d'import de données .Stat (pour des tailles de fichiers illimitées)","upload.path.placeholder":"Entrez un chemin p.ex. \\\\ordinateur\\répertoire_partagé\\MonFichierDeDonneesSdmx.csv","upload.referential.metadata":"Importer des métadonnées de référence","upload.reset":"Réinitialiser","upload.spaces":"Espaces","upload.unknown":"Oups. Quelque chose n'a pas fonctionné correctement de notre côté. Veuillez réessayer plys tard. Si le problème persiste, veillez contacter votre administrateur système, svp.","used.filters.reducing":"Eléments","user.login":"Se Connecter","user.logout":"Se Déconnecter","user.right.actions":"Actions","user.right.add":"Ajouter une nouvelle autorisation","user.right.add.error":"Erreur(s) lors de l'ajout d'une nouvelle autorisation","user.right.add.success":"Ajout d'une nouvelle autorisation réussi","user.right.artefact.agency":"Agence","user.right.artefact.id":"Artefact","user.right.artefact.type":"Type","user.right.artefact.version":"Version","user.right.custom.permissions":"Autorisations spéciales","user.right.custom.permissions.definition":"Combinaisons spéciales d'autorisations granulaires","user.right.delete":"Supprimer l'autorisation {id}","user.right.delete.confirmation":"Êtes-vous sûr de vouloir supprimer l'autorisation {id} ?","user.right.delete.error":"Erreur(s) lors de la suppression de l'autorisation","user.right.delete.success":"Suppression de l'autorisation réussie","user.right.edit":"Modifier l'autorisation {id}","user.right.edit.error":"Erreur(s) lors de la modification de l'autorisation","user.right.edit.success":"Modification de l'autorisation réussie","user.right.filter.artefact.agency":"Filtrer par agence","user.right.filter.artefact.id":"Filtrer par artefact","user.right.filter.artefact.type":"Filtrer par type","user.right.filter.artefact.version":"Filtrer par version","user.right.filter.permission":"Filtrer par autorisation","user.right.filter.space":"Filtrer par esapce","user.right.filter.user":"Filtrer par groupe/utilisateur","user.right.granular.permissions":"Autorisations granulaires","user.right.group":"Groupe","user.right.group.permissions":"Rôles standards","user.right.id":"ID","user.right.permission":"Autorisation","user.right.permission.definition":"Définition","user.right.permissions":"Autorisations","user.right.scope.any":"* (Tout)","user.right.space":"Espace","user.right.user":"Utilisateur","user.right.view":"Détails de l'autorisation {id}","user.rights.count":"{count, number} {count, plural, one {autorisation} other {autorisations}} sur {total, number}","users.none":"Pas d'utilisateur","view.artefact.relatives":"Lister les structures associées","viewer.guidance.bar":"\u003cb\u003eUne couleur unique grise ne permet pas la distinction des colonnes ?\u003c/b\u003e{br}Les colonnes ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général des grandeurs de chaque catégorie. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les catégories auxquelles vous souhaitez appliquer des couleurs. Il existe une séquence de couleurs prédéfinie (maximum 8 couleurs répétées), donc l'ordre de la sélection des couleurs est significatif.{br}{br}\u003cb\u003eLes étiquettes ne sont pas affichées pour les colonnes ?\u003c/b\u003e{br}Les colonnes ne sont étiquetées que s'il y a suffisamment d'espace pour afficher les étiquettes. L'espace vertical minimum nécessaire pour afficher les étiquettes est 50% de la taille du graphique. Pour les visualiser, augmentez la hauteur du graphique. Si l'espace horizontal est aussi parfois insuffisant, augmentez également la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ».{br}{br}\u003cb\u003eLes colonnes représentent des périodes de temps mais elles ne sont pas classées chronologiquement ?\u003c/b\u003e{br}Le graphique est utilisé pour comparer les valeurs statistiques de différentes catégories. Pour faciliter cette comparaison, les colonnes sont toujours ordonnées par ordre croissant des valeurs statistiques. Si vous avez l'intention de visualiser une tendance chronologique, utilisez plutôt la courbe chronologique. Notez que le graphique à colonnes empilées (avec une seule variable par barre) serait une autre alternative si les colonnes sont absolument nécessaires.{br}{br}\u003cb\u003ePlusieurs dimensions sont combinées par barre ?\u003c/b\u003e{br}Si votre sélection varie pour plus d'une des dimensions, les colonnes représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les valeurs d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques.{br}{br}\u003cb\u003eLes colonnes ne contiennent pas les éléments souhaités ?\u003c/b\u003e{br}Assurez-vous de n'inclure dans votre sélection que les éléments de dimension requis.{br}{br}\u003cb\u003eLe graphique n'a pas la taille ou l'échelle de l'axe souhaitée ?\u003c/b\u003e{br}Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.choro":"\u003cb\u003eLa carte n'est pas générée et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ?\u003c/b\u003e{br}Les cartes ont besoin de données couvrant au moins 1 point de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés.{br}{br}\u003cb\u003eLa carte n'affiche pas la variable voulue ?\u003c/b\u003e{br}Les cartes nécessitent exactement 1 point de données par objet cartographique. Adaptez les éléments de dimension actuellement sélectionnés. Les points de données disponibles peuvent être vérifiés dans l'onglet « Tableau ».{br}{br}\u003cb\u003eLe graphique n'a pas la taille souhaitée ?\u003c/b\u003e{br}Utilisez les options de personnalisation de la taille du graphique que vous trouverez dans le menu « Personnaliser ». Notez que l'échelle de zoom n'est actuellement pas personnalisable.{br}{br}\u003cb\u003eLe graphique n'a pas l'échelle de couleurs souhaitée ?\u003c/b\u003e{br}Malheureusement, l'échelle de couleurs n'est actuellement pas personnalisable.","viewer.guidance.hsymbol":"\u003cb\u003e La série de symboles ne contient pas les éléments souhaités ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les symboles) » qui contient les éléments à afficher sous forme de séries de symboles. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de toutes les valeurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir la série de symboles pour laquelle vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent ou réduisez la sélection. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par série de symboles ? \u003c/b\u003e {br} Si votre sélection varie pour plus de deux des dimensions, la série de symboles représentera toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer la série de symboles d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.row":"\u003cb\u003e Une couleur unique grise ne permet pas la distinction des barres horizontales ? \u003c/b\u003e {br} Les barres horizontales ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille de toutes les catégories. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les barres horizontales auxquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les barres horizontales ? \u003c/b\u003e {br} Les barres horizontales ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent ou réduisez la sélection. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e ou \u003cb\u003e Aucune ligne n'est affichée ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par ligne? \u003c/b\u003e {br} Si votre sélection varie pour plusieurs dimensions, les barres horizontales représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les valeurs d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e Les barres horizontales ne contiennent pas les éléments souhaités ? \u003c/b\u003e {br} Assurez-vous de n'inclure dans votre sélection que les éléments de dimension requis. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.scatter":"\u003cb\u003e Les axes de dispersion horizontaux et/ou verticaux ne contiennent pas les variables souhaitées ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les axes horizontal et vertical) » contenant les variables (éléments) à comparer. Sélectionnez également les éléments de dimension correspondants à comparer en tant que « Valeur de la dimension pour l'axe horizontal » et « Valeur de la dimension pour l'axe vertical ». {br} {br} \u003cb\u003e Le graphique n'affiche qu'un seul point ? \u003c/b\u003e {br} Les nuages ​​de points comparent pour deux valeurs d'une dimension les valeurs variables d'une (ou plusieurs) autre(s) dimension(s). Par conséquent, les nuages ​​de points nécessitent plusieurs sélections dans au moins deux dimensions. Assurez-vous que votre sélection est adéquate. Utilisez le « Tableau » pour vérifier également la disponibilité des données. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 1 point de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des points ? \u003c/b\u003e {br} Les points ne sont colorés que s'ils sont spécialement mis en couleurs, sinon l'objectif est d'obtenir un aperçu général de la distribution permettant d'identifier le type de relation entre les variables tracées. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les éléments de dimension pour lesquels vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.stacked-bar":"\u003cb\u003e Les colonnes empilées ne représentent pas les catégories et les variables prévues ? \u003c/b\u003e {br} Le graphique à colonnes empilées est utilisé pour comparer plusieurs valeurs statistiques pour différentes catégories. Utilisez le menu « Personnaliser » pour choisir la dimension utilisée pour distinguer les bacolonnesrres empilées comme « Série du graphique (dimension pour l'axe horizontal) ». Les segments de barre représenteront toutes les combinaisons possibles des autres éléments de dimension sélectionnés (avec une limitation de 5 segments maximum). Réduisez la sélection à seulement deux dimensions variables si les segments doivent représenter les éléments d'une seule dimension. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des colonnes empilées ? \u003c/b\u003e {br} Les colonnes empilées ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille des valeurs de toutes les catégories. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les colonnes empilées pour lesquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. Le schéma d'ombrage ne peut pas être modifié. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les colonnes empilées ? \u003c/b\u003e {br} Les colonnes empilées ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Vous vouliez un graphique à colonnes empilées en pourcentage ? \u003c/b\u003e {br} Utilisez l'option de personnalisation « Pourcentage » que vous trouverez dans le menu « Personnaliser ». Ce type de graphique permet de comparer les répartitions dans une dimension. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Les graphiques à colonnes empilées nécessitent des données couvrant au moins 2 points de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.stacked-row":"\u003cb\u003e Les barres horizontales empilées ne représentent pas les catégories et les variables prévues ? \u003c/b\u003e {br} Le graphique à barres horizontales empilées est utilisé pour comparer plusieurs valeurs statistiques pour différentes catégories. Utilisez le menu « Personnaliser » pour choisir la dimension utilisée pour distinguer les barres horizontales empilées comme « Série du graphique (dimension pour l'axe vertical) ». Les segments de barre horizontale représenteront toutes les combinaisons possibles des autres éléments de dimension sélectionnés (avec une limitation de 5 segments maximum). Réduisez la sélection à seulement deux dimensions variables si les segments doivent représenter les éléments d'une seule dimension. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des barres horizontales empilées ? \u003c/b\u003e {br} Les barres horizontales empilées ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille des valeurs de toutes les catégories. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les barres horizontales empilées pour lesquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. Le schéma d'ombrage ne peut pas être modifié. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les barres horizontales empilées ? \u003c/b\u003e {br} Les barres horizontales empilées ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Vous vouliez un graphique à barres horizontales empilées en pourcentage ? \u003c/b\u003e {br} Utilisez l'option de personnalisation « Pourcentage » que vous trouverez dans le menu « Personnaliser ». Ce type de graphique permet de comparer les répartitions dans une dimension. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Les graphiques à barres horizontales empilées nécessitent des données couvrant au moins 2 points de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.timeline":"\u003cb\u003eUne couleur unique grise ne permet pas la distinction des courbes chronologiques ?\u003c/b\u003e{br}Les courbes chronologiques ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général des tendances de toutes les courbes chronologiques. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les courbes chronologiques auxquelles vous souhaitez appliquer des couleurs. Il existe une séquence de couleurs prédéfinie (maximum 6 couleurs répétées), donc l'ordre de la sélection est significatif.{br}{br}\u003cb\u003eLes étiquettes ne sont pas affichées pour les courbes chronologiques ?\u003c/b\u003e{br}Les courbes chronologiques ne sont étiquetées que si elles sont spécialement mises en couleurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour sélectionner les courbes pour lesquelles vous souhaitez voir les étiquettes. {br} {br} \u003cb\u003e Les courbes chronologiques en couleurs n'affichent pas de points pour les valeurs ? \u003c/b\u003e {br} Les points sur les courbes ne sont affichés que s'il y a suffisamment d'espace horizontal qui permet de bien distinguer les points. Augmentez la largeur du graphique ou réduisez la sélection de la plage de périodes de temps. {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par courbe chronologique ? \u003c/b\u003e {br} Si, en dehors de la dimension temporelle, votre sélection varie pour plusieurs dimensions, les courbes chronologiques représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les courbes chronologiques d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques.{br}{br}\u003cb\u003eLe graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ?\u003c/b\u003e{br}Les graphiques chronologiques ont besoin une couverture des données d'au moins 2 périodes de temps. Vérifiez et augmentez l'actuelle sélection de la période de temps.{br}{br}\u003cb\u003eLe graphique n'a pas la taille ou l'échelle de l'axe souhaitée ?\u003c/b\u003e{br}Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.vsymbol":"\u003cb\u003e La série de symboles ne contient pas les éléments souhaités ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les symboles) » qui contient les éléments à afficher sous forme de séries de symboles. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de toutes les valeurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir la série de symboles pour laquelle vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par série de symboles ? \u003c/b\u003e {br} Si votre sélection varie pour plus de deux des dimensions, la série de symboles représentera toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer la série de symboles d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e LLe graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidances.chart":"💡 Vous n'obtenez pas le graphique souhaité ?","viewer.guidances.table":{},"viewer.no.id":"L'URL ne contient pas d'identifiant de vue partagée.","vis.data.availability.disabled":"En raison de la taille importante de cet ensemble de données, nous ne sommes pas en mesure d'indiquer que certaines sélections de filtres ne disposent pas de données.","vx.config.copyright":"Supprimer les droits d'auteur","vx.config.display.both":"Libellé et identifiant","vx.config.display.code":"Identifiant","vx.config.display.label":"Libellé","vx.config.logo":"Supprimer le logo","vx.config.reset":"Réinitialiser","vx.config.source":"Source des libellés","vx.config.subtitle":"Sous-titre","vx.config.title":"Titre","vx.config.uniq.focus.option":"Courbe chronologique","vx.filter.all.selection":"Sélectionner tout","vx.filter.apply":"Appliquer","vx.filter.branch.selection":"Branche entière","vx.filter.children.selection":"Cet élément et tous les éléments directement "Filteren op Agency","user.right.filter.artefact.id":"Filteren op artefact","user.right.filter.artefact.type":"Filteren op type","user.right.filter.artefact.version":"Filteren op versie","user.right.filter.permission":"Filteren op toestemming","user.right.filter.space":"Filteren op spatie","user.right.filter.user":"Filter op groep/gebruiker","user.right.granular.permissions":"Gedetailleerde machtigingen","user.right.group":"Groep","user.right.group.permissions":"Standaard rollen","user.right.id":"ID","user.right.permission":"Toestemming","user.right.permission.definition":"Definitie","user.right.permissions":"Rechten","user.right.scope.any":"* (Elk)","user.right.space":"Gegevensruimte","user.right.user":"gebruiker","user.right.view":"Details voor toestemming {id}","user.rights.count":"{count, number} {count, plural, one {Toestemming} other {Rechten}} van de {total, number}","users.none":"Geen gebruiker","view.artefact.relatives":"Lijst gerelateerde structuren","viewer.guidance.bar":"\u003cb\u003eAlle balken zijn grijs en kunnen niet van elkaar worden onderscheiden?\u003c/b\u003e{br}Balken zijn alleen gekleurd als ze speciaal zijn gemarkeerd, anders is hun doel om een ​​algemeen maatoverzicht van alle categorieën te geven. Gebruik de highlight-functie onder het menu 'Aanpassen' om de balken te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de gemarkeerde selectie is significant.{br}{br}\u003cb\u003eDe balken zijn niet gelabeld?\u003c/b\u003e{br}Balken zijn alleen gelabeld als er is genoeg ruimte voor die labels. De minimaal vereiste verticale ruimte voor labels is 50% van de diagramgrootte. Verhoog de kaarthoogte totdat labels worden weergegeven. Soms is de horizontale ruimte ook onvoldoende, probeer daarom ook de kaartbreedte te vergroten. U vindt deze opties onder het menu 'Aanpassen'.{br}{br}\u003cb\u003eDe balken geven tijdsperioden weer, maar zijn niet chronologisch gerangschikt?\u003c/b\u003e{br}Het staafdiagram wordt gebruikt om de statistische waarden van verschillende categorieën, en om deze vergelijking te vergemakkelijken, worden de staven altijd oplopend gerangschikt volgens de statistische waarden. Als u een chronologische trend wilt visualiseren, gebruikt u in plaats daarvan de tijdlijngrafiek. Merk op dat het gestapelde staafdiagram (met slechts één variabele per staaf) een ander alternatief zou zijn als staven absoluut vereist zijn.{br}{br}\u003cb\u003eMeerdere dimensies worden per staaf gecombineerd?\u003c/b\u003e{br}Als uw selectie varieert voor meer dan een van de dimensies, dan vertegenwoordigen de balken alle mogelijke combinaties van de geselecteerde dimensie-items. Als u de waarden van slechts één dimensie wilt vergelijken, zorg er dan voor dat alle andere dimensies enkele selecties hebben.{br}{br}\u003cb\u003eBevatten de balken niet de gewenste items?\u003c/b\u003e{br}neem in uw selectie alleen de vereiste dimensie-items op.{br}{br}\u003cb\u003eHeeft het diagram niet de gewenste grootte of asschaal?\u003c/b\u003e{br}Gebruik de verschillende opties voor diagramaanpassing die u zult vinden onder het menu 'Aanpassen'.","viewer.guidance.choro":"\u003cb\u003eDe kaart wordt niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'?\u003c/b\u003e{br}Kaarten hebben gegevens nodig die ten minste één gegevenspunt beslaan. Controleer en vergroot de momenteel geselecteerde dimensie-items.{br}{br}\u003cb\u003eGeeft de kaart de bedoelde variabele niet weer?\u003c/b\u003e{br}Kaarten hebben precies 1 gegevenspunt per kaartobject nodig. Pas de momenteel geselecteerde dimensie-items aan. Beschikbare gegevenspunten kunnen worden gecontroleerd met het tabblad 'Tabel'.{br}{br}\u003cb\u003eHeeft het diagram niet de gewenste grootte?\u003c/b\u003e{br}Gebruik de opties voor het aanpassen van het diagramformaat die u zult vinden onder het menu 'Aanpassen'. Merk op dat de zoomschaal momenteel niet aanpasbaar is.{br}{br}\u003cb\u003eHeeft de kaart niet de gewenste kleurenschaal?\u003c/b\u003e{br}Helaas kan de kleurenschaal momenteel niet worden aangepast.","viewer.guidance.hsymbol":"\u003cb\u003e De symboolreeks bevat niet de gewenste items? \u003c/b\u003e {br} Gebruik het menu 'Aanpassen' om de dimensie te kiezen als 'Grafiek reeks (dimensie voor symbolen)' die de items bevat die als symboolreeks moeten worden weergegeven. {br} {br} \u003cb\u003e Alle symboolreeksen zijn grijs en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Symboolreeksen zijn alleen gekleurd als ze speciaal zijn gemarkeerd, anders is hun doel om een ​​algemeen overzicht van alle waarden te geven. Gebruik de highlight-functie onder het menu 'Aanpassen' om de symboolreeks te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. {br} {br} \u003cb\u003e De symboolreeks is niet gelabeld? \u003c/b\u003e {br} Symboolreeksen worden alleen gelabeld als er voldoende ruimte is voor die labels. Verhoog de kaarthoogte totdat labels worden weergegeven of verklein de selectie. Soms is de horizontale ruimte ook onvoldoende, probeer daarom ook de kaartbreedte te vergroten. Je vindt deze opties onder het menu 'Aanpassen'. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e {br} Zorg ervoor dat u een selectie heeft die ten minste 2 gegevenspunten bevat. U kunt de beschikbaarheid van gegevens controleren via het tabblad 'Tabel'. {br} {br} \u003cb\u003e Meerdere dimensies worden gecombineerd per symboolreeks? \u003c/b\u003e {br} Als uw selectie varieert voor meer dan twee dimensies, vertegenwoordigt de symboolreeks alle mogelijke combinaties van de geselecteerde dimensie-items. Als u de symboolreeks van slechts één dimensie wilt vergelijken, zorg er dan voor dat alle andere dimensies enkele selecties hebben. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.row":"\u003cb\u003e Alle rijen zijn grijs en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Rijen zijn alleen gekleurd als ze speciaal zijn gemarkeerd, anders is hun doel om een ​​algemeen formaatoverzicht van alle categorieën te geven. Gebruik de highlight-functie onder het menu 'Aanpassen' om de rijen te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. {br} {br} \u003cb\u003e De rijen zijn niet gelabeld? \u003c/b\u003e {br} Rijen worden alleen gelabeld als er voldoende ruimte is voor die labels. Verhoog de kaarthoogte totdat labels worden weergegeven of verklein de selectie. Soms is de horizontale ruimte ook onvoldoende, probeer daarom ook de kaartbreedte te vergroten. Je vindt deze opties onder het menu 'Aanpassen'. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e of \u003cb\u003e Er worden geen rijen weergegeven? \u003c/b\u003e {br} Zorg ervoor dat u een selectie heeft die ten minste 2 gegevenspunten bevat. U kunt de beschikbaarheid van gegevens controleren via het tabblad 'Tabel'. {br} {br} \u003cb\u003e Meerdere dimensies gecombineerd per rij? \u003c/b\u003e {br} Als uw selectie varieert voor meer dan een van de dimensies, vertegenwoordigen de rijen alle mogelijke combinaties van de geselecteerde dimensie-items. Als u de waarden van slechts één dimensie wilt vergelijken, zorg er dan voor dat alle andere dimensies één selectie hebben. {br} {br} \u003cb\u003e De rijen bevatten niet de gewenste items? \u003c/b\u003e {br} Zorg ervoor dat u in uw selectie alleen de vereiste dimensie-items opneemt. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.scatter":"\u003cb\u003e De horizontale en/of verticale spreidingsassen bevatten niet de gewenste variabelen? \u003c/b\u003e {br} Gebruik het menu 'Aanpassen' om de dimensie te kiezen als 'Grafiek reeks (dimensie voor X- en Y-assen)' die de te vergelijken variabelen (items) bevat. Selecteer ook de corresponderende dimensie-items die moeten worden vergeleken als 'Dimensiewaarde voor X-as' en 'Dimensiewaarde voor Y-as'. {br} {br} \u003cb\u003e Het diagram toont slechts één punt? \u003c/b\u003e {br} Spreidingsplots vergelijken voor twee waarden van één dimensie de variërende waarden van één (of meer) andere dimensie(s). Daarom vereisen spreidingsplots meerdere selecties in ten minste twee dimensies. Zorg ervoor dat uw selectie voldoende is. Gebruik de 'Tabel' om ook de beschikbaarheid van gegevens te controleren. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e {br} Zorg ervoor dat u een selectie heeft die ten minste één gegevenspunt bevat. U kunt de beschikbaarheid van gegevens controleren via het tabblad 'Tabel'. {br} {br} \u003cb\u003e Alle punten zijn grijs en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Punten worden alleen gekleurd als ze speciaal zijn gemarkeerd, anders is het hun doel om een ​​algemeen distributieoverzicht te bieden waarmee het type relatie tussen de geplotte variabelen kan worden geïdentificeerd. Gebruik de highlight-functie onder het menu 'Aanpassen' om de dimensie-items te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.stacked-bar":"\u003cb\u003e De gestapelde balken vertegenwoordigen niet de bedoelde categorieën en variabelen? \u003c/b\u003e {br} Het gestapelde staafdiagram wordt gebruikt om verschillende statistische waarden voor verschillende categorieën te vergelijken. Gebruik het menu 'Aanpassen' om de dimensie te kiezen die wordt gebruikt om de gestapelde staven te onderscheiden als 'Grafiek reeks (dimensie voor X-as)'. De staafsegmenten vertegenwoordigen alle mogelijke combinaties van de andere geselecteerde dimensie-items (met een beperking tot maximaal 5 segmenten). Beperk de selectie tot slechts twee verschillende dimensies als de segmenten de items van één enkele dimensie moeten vertegenwoordigen. {br} {br} \u003cb\u003e Alle gestapelde staven zijn grijs gearceerd en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Gestapelde balken worden alleen gekleurd als ze speciaal zijn gemarkeerd, anders is het hun doel om een ​​algemeen formaatoverzicht te bieden voor de waarden van alle categorieën. Gebruik de highlight-functie onder het menu 'Aanpassen' om de gestapelde balken te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. Het schaduwschema kan niet worden gewijzigd. {br} {br} \u003cb\u003e De gestapelde staven zijn niet gelabeld? \u003c/b\u003e {br} Gestapelde staven worden alleen gelabeld als er voldoende ruimte is voor die labels. De minimaal vereiste verticale ruimte voor labels is 50% van de diagramgrootte. Verhoog de kaarthoogte totdat labels worden weergegeven. Soms is de horizontale ruimte ook onvoldoende, probeer daarom ook de kaartbreedte te vergroten. Je vindt deze opties onder het menu 'Aanpassen'. {br} {br} \u003cb\u003e U wilde een gestapeld percentage-staafdiagram? \u003c/b\u003e {br} Gebruik de aanpassingsoptie 'Percentage' die u vindt onder het menu 'Aanpassen'. Met dit diagramtype kunnen aandelen in een dimensie worden vergeleken. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e {br} Gestapelde staafdiagrammen hebben gegevens nodig die ten minste twee gegevenspunten beslaan. Controleer en vergroot de momenteel geselecteerde dimensie-items. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.stacked-row":"\u003cb\u003eDe gestapelde rijen vertegenwoordigen niet de beoogde categorieën en variabelen?\u003c/b\u003e{br}Het gestapelde rijdiagram wordt gebruikt om verschillende statistische waarden voor verschillende categorieën te vergelijken. Gebruik het menu 'Aanpassen' om de dimensie te kiezen die wordt gebruikt om de gestapelde rijen te onderscheiden als 'Grafiekreeks (dimensie voor Y-as)'. De rijsegmenten vertegenwoordigen alle mogelijke combinaties van de andere geselecteerde dimensie-items (met een limiet van maximaal 5 segmenten). Beperk de selectie tot slechts twee verschillende dimensies als de segmenten de items van één dimensie moeten vertegenwoordigen.{br}{br}\u003cb\u003eAlle gestapelde rijen zijn grijs gearceerd en kunnen niet worden onderscheiden?\u003c/b\u003e{br}Gestapelde rijen zijn alleen gekleurd als ze speciaal zijn gemarkeerd, anders is hun doel om een ​​algemeen maatoverzicht te bieden voor de waarden van alle categorieën. Gebruik de markeringsfunctie onder het menu 'Aanpassen' om de gestapelde rijen te kiezen waarop u kleuren wilt toepassen. Er is een vooraf gedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de selectie van highlights is belangrijk. Het arceringschema kan niet worden gewijzigd.{br}{br}\u003cb\u003eDe gestapelde rijen zijn niet gelabeld?\u003c/b\u003e{br}Gestapelde rijen worden alleen gelabeld als er voldoende ruimte is voor die labels. De minimaal vereiste verticale ruimte voor labels is 50% van de grafiekgrootte. Verhoog de kaarthoogte totdat labels worden weergegeven. Ook is de horizontale ruimte soms onvoldoende, dus probeer ook de kaartbreedte te vergroten. U vindt deze opties in het menu 'Aanpassen'.{br}{br}\u003cb\u003eU wilde een gestapeld rijdiagram met percentages?\u003c/b\u003e{br}Gebruik de aanpassingsoptie 'Percentage' die u vindt onder het menu 'Aanpassen'. Met dit diagramtype kunnen aandelen in een dimensie worden vergeleken.{br}{br}\u003cb\u003eHet diagram wordt niet gegenereerd en u ziet het bericht 'Er zijn geen gegevens voor de huidige selectie. Wijzig de selectie.'?\u003c/b\u003e{br}Gestapelde rijdiagrammen hebben gegevens nodig die ten minste 2 gegevenspunten beslaan. Controleer en vergroot de momenteel geselecteerde dimensie-items.{br}{br}\u003cb\u003eHet diagram heeft niet de gewenste grootte of asschaal?\u003c/b\u003e{br}Gebruik de verschillende aanpassingsopties voor diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.timeline":"\u003cb\u003e Alle lijnen zijn grijs en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Tijdlijnen zijn alleen gekleurd als ze speciaal zijn gemarkeerd, anders is het hun doel om een ​​algemeen trendoverzicht van alle tijdlijnen te geven. Gebruik de highlight-functie onder het menu 'Aanpassen' om de tijdlijnen te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. {br} {br} \u003cb\u003e De tijdlijnen zijn niet gelabeld? \u003c/b\u003e {br} Tijdlijnen worden alleen gelabeld als ze speciaal zijn gemarkeerd. Gebruik de highlight-functie onder het menu 'Aanpassen' om de tijdlijnen te kiezen waarvoor u labels wilt zien. {br} {br} \u003cb\u003e De gemarkeerde tijdlijnen geven geen punten weer voor waarden? \u003c/b\u003e {br} Punten op tijdlijnen worden alleen weergegeven als er voldoende horizontale ruimte is om de punten goed te kunnen onderscheiden. Vergroot de breedte van de grafiek of verklein de selectie van het tijdsperiodebereik. {br} {br} \u003cb\u003e Meerdere dimensies gecombineerd per tijdlijn? \u003c/b\u003e {br} Als, afgezien van de tijdsdimensie, uw selectie varieert voor meer dan een van de dimensies, dan vertegenwoordigen de tijdlijnen alle mogelijke combinaties van de geselecteerde dimensie-items. Als u de tijdlijnen van slechts één dimensie wilt vergelijken, zorg er dan voor dat alle andere dimensies enkele selecties hebben. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e {br} Tijdlijndiagrammen hebben gegevens nodig over ten minste twee perioden. Controleer en vergroot het momenteel geselecteerde tijdbereik. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidance.vsymbol":"\u003cb\u003e De symboolreeks bevat niet de gewenste items? \u003c/b\u003e {br} Gebruik het menu 'Aanpassen' om de dimensie te kiezen als 'Grafiek reeks (dimensie voor symbolen)' die de items bevat die als symboolreeks moeten worden weergegeven. {br} {br} \u003cb\u003e Alle symboolreeksen zijn grijs en kunnen niet worden onderscheiden? \u003c/b\u003e {br} Symboolreeksen worden alleen gekleurd als ze speciaal zijn gemarkeerd, anders is het hun doel om een ​​algemeen overzicht van alle waarden te geven. Gebruik de highlight-functie onder het menu 'Aanpassen' om de symboolreeks te kiezen waarvoor u kleuren wilt toepassen. Er is een voorgedefinieerde kleurvolgorde (maximaal 8 herhaalde kleuren), dus de volgorde van de highlight-selectie is significant. {br} {br} \u003cb\u003e De symboolreeks is niet gelabeld? \u003c/b\u003e {br} Symboolreeksen worden alleen gelabeld als er voldoende ruimte is voor die labels. De minimaal vereiste verticale ruimte voor labels is 50% van de diagramgrootte. Verhoog de kaarthoogte totdat labels worden weergegeven. Soms is de horizontale ruimte ook onvoldoende, probeer daarom ook de kaartbreedte te vergroten. Je vindt deze opties onder het menu 'Aanpassen'. {br} {br} \u003cb\u003e Het diagram is niet gegenereerd en u ziet een bericht 'Er zijn geen gegevens voor de huidige selectie.  Gelieve de selectie te wijzigen.'? \u003c/b\u003e {br} Zorg ervoor dat u een selectie heeft die ten minste 2 gegevenspunten bevat. U kunt de beschikbaarheid van gegevens controleren via het tabblad 'Tabel'. {br} {br} \u003cb\u003e Meerdere dimensies worden gecombineerd per symboolreeks? \u003c/b\u003e {br} Als uw selectie varieert voor meer dan twee dimensies, vertegenwoordigt de symboolreeks alle mogelijke combinaties van de geselecteerde dimensie-items. Als u de symboolreeks van slechts één dimensie wilt vergelijken, zorg er dan voor dat alle andere dimensies enkele selecties hebben. {br} {br} \u003cb\u003e Heeft het diagram niet de gewenste grootte of asschaal? \u003c/b\u003e {br} Gebruik de verschillende opties voor het aanpassen van diagrammen die u vindt onder het menu 'Aanpassen'.","viewer.guidances.chart":"💡 Voldoet de weergegeven grafiek niet aan uw verwachtingen?","viewer.guidances.table":{},"viewer.no.id":"Er is geen ID voor een gedeeld beeld opgenomen in de URL.","vis.data.availability.disabled":"Vanwege de omvang van deze dataset kunnen we niet aangeven of er voor bepaalde filterkeuzes geen gegevens beschikbaar zijn.","vx.config.copyright":"Verwijder het auteursrecht","vx.config.display.both":"Beide","vx.config.display.code":"Identificatiecode","vx.config.display.label":"Naam","
